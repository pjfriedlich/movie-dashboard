    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
      }

    <style>
        body { background: linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%); color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px 16px 125px 16px; box-sizing: border-box; overscroll-behavior-y: contain; -webkit-font-smoothing: antialiased; }
        .header { display: flex; width: 100%; align-items: center; border-bottom: 1px solid rgba(15, 23, 42, 0.08); padding-bottom: 14px; margin-bottom: 20px; box-sizing: border-box; }

        #pull-indicator { width: 100%; height: 0px; overflow: hidden; text-align: center; background: #cbd5e1; color: #ea580c; font-size: 11px; font-weight: bold; text-transform: uppercase; line-height: 40px; border-radius: 12px; transition: height 0.1s ease-out; }
        .section-divider { width: 100%; height: 1px; background: linear-gradient(90deg, rgba(15,23,42,0.08) 0%, rgba(15,23,42,0.02) 100%); margin: 24px 0; border: none; }

               .row-container { margin-bottom:26px; width:100%; display:block; }

        .scroll-poster { width:100%; height:200px; background:#e2e8f0; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; box-sizing:border-box; }
        .rating-badge { position:absolute; bottom:8px; right:8px; background:rgba(15,23,42,0.9); color:#34d399; font-weight:800; font-size:10px; padding:3px 7px; border-radius:6px; }
        .card-details { padding:10px; background:#ffffff; text-align:left; box-sizing:border-box; border-top:1px solid #e2e8f0; }
        .card-title { font-weight:700; font-size:12px; color:#0f172a; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .card-meta { font-size:10px; color:#64748b; margin-top:4px; font-weight: 600; }
        .torrent-card { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.04); display: flex; flex-direction: column; gap: 8px; }
        .torrent-title { font-size: 14px; font-weight: 700; color: #0f172a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .torrent-meta { display: flex; justify-content: space-between; font-size: 11px; color: #64748b; font-weight: 600; }
        .torrent-progress-bg { width: 100%; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; position: relative; }
        .torrent-progress-fill { height: 100%; background: linear-gradient(90deg, #f97316 0%, #ea580c 100%); width: 0%; transition: width 0.3s ease; }
        .settings-container { display:flex; flex-direction:column; gap:16px; padding:4px 0; width:100%; box-sizing:border-box; }
        .form-group { display:flex; flex-direction:column; gap:8px; width:100%; box-sizing:border-box; }
        .form-group label { font-size:11px; font-weight:800; color:#475569; text-transform:uppercase; letter-spacing:0.5px; }
        .form-group input, .form-group textarea { background:#ffffff; border:1px solid #cbd5e1; border-radius:12px; padding:14px; color:#0f172a; font-size:14px; outline:none; width:100%; box-sizing:border-box; }
        .form-group textarea { height:90px; resize:vertical; font-family:sans-serif; }
        .btn-action { width:100%; padding:16px; background:linear-gradient(90deg, #f97316 0%, #ea580c 100%); color:#ffffff; border:none; border-radius:14px; font-weight:800; text-transform:uppercase; font-size:12px; cursor:pointer; margin-top:8px; box-shadow: 0 4px 12px rgba(234,88,12,0.15); }
        .nav-footer { position:fixed; bottom:0; left:0; right:0; height:86px; background:rgba(255, 255, 255, 0.9); border-top:1px solid #cbd5e1; display:flex; justify-content:space-around; align-items:center; z-index:40; box-sizing:border-box; padding-bottom:calc(10px + env(safe-area-inset-bottom)); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .nav-btn { background:none; border:none; color:#64748b; font-weight:800; font-size:11px; text-transform:uppercase; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; gap:4px; flex:1; height:100%; }
        .nav-btn.active { color:#f97316; }
        .nav-icon-wrapper { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; margin-bottom: 2px; }
        .nav-svg-icon { width: 28px; height: 28px; fill: currentColor; }
        .modal-overlay { position:fixed; inset:0; background:#f1f5f9; z-index:100; box-sizing:border-box; overflow-y:auto; display:flex; flex-direction:column; }
        .detail-hero-backdrop { width:100%; height:260px; background-size:cover; background-position:center; position:relative; }
        .detail-hero-backdrop::after { content:''; position:absolute; inset:0; background:linear-gradient(to bottom, transparent 20%, #f1f5f9 100%); }
        .detail-close-trigger { position:absolute; top:20px; right:20px; background:rgba(255,255,255,0.9); border:1px solid #cbd5e1; color:#0f172a; font-size:20px; font-weight:bold; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:110; }
        .detail-content-frame { padding:0 24px 48px 24px; margin-top:-100px; position:relative; z-index:105; display:flex; flex-direction:column; gap:22px; }
        .detail-main-row { display:flex; gap:18px; align-items:flex-end; }
        .detail-poster-wrapper { width:115px; height:172px; border-radius:14px; overflow:hidden; border:1px solid #cbd5e1; background:#ffffff; flex-shrink:0; box-shadow:0 8px 20px rgba(0,0,0,0.08); }
        .detail-poster-img { width:100%; height:100%; object-fit:cover; }
        .detail-meta-block { display:flex; flex-direction:column; gap:6px; flex:1; min-width:0; }
        .detail-heading-title { font-size:24px; font-weight:800; color:#0f172a; line-height:1.2; letter-spacing: -0.5px; }
        .detail-sub-specs { font-size:12px; color:#475569; font-weight:700; }
        .detail-metrics-rack { display:grid; grid-template-cols:1fr; background:#ffffff; border:1px solid #cbd5e1; padding:14px; border-radius:14px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); }
        .metric-pill { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700; color:#334155; }
        .metric-txt span { color:#f97316; font-weight:800; }
        .detail-synopsis-box { font-size:14px; color:#334155; line-height:1.6; }
        .detail-synopsis-box h4 { font-size:11px; text-transform:uppercase; color:#64748b; letter-spacing:0.5px; margin-bottom:6px; font-weight:700; }
        .detail-footer-actions { display:flex; flex-direction:column; gap:10px; margin-top:10px; }
        .btn-panel-primary { width:100%; padding:15px; background:linear-gradient(90deg, #f97316 0%, #ea580c 100%); color:#ffffff; border:none; border-radius:12px; font-weight:800; text-transform:uppercase; font-size:12px; cursor:pointer; box-shadow: 0 4px 12px rgba(234,88,12,0.15); }
        .btn-panel-disabled { width:100%; padding:15px; background:#cbd5e1; color:#64748b; border:1px solid #cbd5e1; border-radius:12px; font-weight:800; text-transform:uppercase; font-size:12px; cursor:not-allowed; }
        .btn-unwatch-action { position:absolute; top:20px; left:20px; background:#ef4444; border:none; color:#ffffff; font-size:11px; font-weight:800; text-transform:uppercase; padding:10px 16px; border-radius:20px; cursor:pointer; z-index:115; box-shadow:0 4px 10px rgba(239,68,68,0.2); }
        .trailer-btn { background:#ffffff; color:#334155; border:1px solid #cbd5e1; font-size:11px; font-weight:800; text-transform:uppercase; padding:8px 14px; border-radius:8px; cursor:pointer; width:fit-content; margin-top:6px; }
        .trailer-video-box { width:100%; height:210px; border-radius:16px; overflow:hidden; border:1px solid #cbd5e1; background:#000000; display:none; box-shadow: 0 6px 16px rgba(0,0,0,0.1); }

</head>
<body>
    <div id="pull-indicator">⬇️ Pull down to refresh...</div>
    <div id="view-root"></div>
      <script>
        let currentTab = localStorage.getItem('app_current_tab') || 'collection';
        let currentSubTab = localStorage.getItem('app_current_sub_tab') || 'downloaded';
        let modalOpen = false, activeItem = null, friendRowData = [], isRadarrLoading = false, activeTorrents = [];
        let searchResultsData = []; 
        let myCollection = JSON.parse(localStorage.getItem('local_collection')) || [];
        let tracks = { "Action": [], "Comedy": [], "Drama": [], "Adventure": [], "Mystery": [], "Sci-Fi": [], "1960s": [], "1970s": [], "1980s": [], "1990s": [], "2000s": [] };
        let localWatchedCache = JSON.parse(localStorage.getItem('local_watched_cache')) || [];
        let startY = 0, isPulling = false;

        function switchTab(targetTab) { 
            currentTab = targetTab; 
            localStorage.setItem('app_current_tab', targetTab); 
            render(); 
            if (targetTab === 'downloads') syncQBittorrentList();
        }
        function switchSubTab(targetSub) { currentSubTab = targetSub; localStorage.setItem('app_current_sub_tab', targetSub); render(); }
        function clearGlobalSearch() { let inputField = document.getElementById('search-input'); if (inputField) inputField.value = ''; searchResultsData = []; render(); }
        function closeM() { modalOpen = false; activeItem = null; render(); }

        async function syncQBittorrentList() {
            let u = localStorage.getItem('qbit_url'); if (!u || currentTab !== 'downloads') return;
            try {
                let res = await fetch(`${u.replace(/\/$/, "")}/api/v2/torrents/info?filter=all`);
                let list = await res.json();
                if (Array.isArray(list)) {
                    activeTorrents = list.map(t => ({ name: t.name, progress: (t.progress * 100).toFixed(1), size: (t.size / 1073741824).toFixed(2), speed: (t.dlspeed / 1048576).toFixed(1), status: t.state }));
                    if (currentTab === 'downloads') render();
                }
            } catch(e) {}
        }

        function launchModalFromAttributes(poolType, targetKey, trackName = null) {
            try {
                let targetObject = null;
                if (poolType === 'search') targetObject = searchResultsData[parseInt(targetKey)];
                else if (poolType === 'friend') {
                    let filteredFriends = friendRowData.filter(m => !localWatchedCache.includes(String(m.title).toLowerCase().trim()) && (!m.tmdbId || !localWatchedCache.includes(String(m.tmdbId))));
                    targetObject = filteredFriends[parseInt(targetKey)];
                } else if (poolType === 'discover') {
                    let filteredDiscover = (tracks[trackName] || []).filter(m => !localWatchedCache.includes(String(m.title).toLowerCase().trim()) && (!m.tmdbId || !localWatchedCache.includes(String(m.tmdbId))));
                    targetObject = filteredDiscover[parseInt(targetKey)];
                } else if (poolType === 'library') {
                    let watchedMovies = myCollection.filter(m => m.played === true || localWatchedCache.includes(String(m.tmdbId)) || localWatchedCache.includes(String(m.title).toLowerCase().trim()));
                    let downloadedMovies = myCollection.filter(m => m.hasFile === true);
                    let comingSoonMovies = myCollection.filter(m => !m.hasFile && !m.played);
                    if (currentSubTab === 'watched') targetObject = watchedMovies.find(m => String(m.id).trim() === String(targetKey).trim());
                    else if (currentSubTab === 'downloaded') targetObject = downloadedMovies.find(m => String(m.id).trim() === String(targetKey).trim());
                    else if (currentSubTab === 'comingsoon') targetObject = comingSoonMovies.find(m => String(m.id).trim() === String(targetKey).trim());
                }
                if (!targetObject) return;
                activeItem = JSON.parse(JSON.stringify(targetObject)); activeItem.trailerKey = null; modalOpen = true; render();
                let tk = localStorage.getItem('tmdb_key');
                if (tk && activeItem.tmdbId && !isNaN(activeItem.tmdbId)) {
                    fetch(`https://api.themoviedb.org/3/movie/${activeItem.tmdbId}?api_key=${tk}`)
                        .then(res => res.json()).then(d => {
                            if (d && modalOpen) {
                                activeItem.overview = d.overview || activeItem.overview;
                                activeItem.runtime = d.runtime ? `${d.runtime}m` : '104m';
                                activeItem.vote_average = d.vote_average ? d.vote_average.toFixed(1) : null;
                                activeItem.backdrop_path = d.backdrop_path ? `https://image.tmdb.org/t/p/w780${d.backdrop_path}` : '';
                                render();
                            }
                        }).catch(() => {});
                    fetch(`https://api.themoviedb.org/3/movie/${activeItem.tmdbId}/videos?api_key=${tk}`)
                        .then(res => res.json()).then(v => {
                            if (v.results && modalOpen) {
                                let trailer = v.results.find(vid => vid.type === "Trailer" && vid.site === "YouTube");
                                if (trailer) { activeItem.trailerKey = trailer.key; render(); }
                            }
                        }).catch(() => {});
                }
            } catch (e) { console.error(e); }
        }
          function executeToggleWatched() {
            if (!activeItem) return;
            let titleStr = String(activeItem.title), titleLower = titleStr.toLowerCase().trim();
            let tmdbIdStr = activeItem.tmdbId ? String(activeItem.tmdbId) : null, internalIdStr = activeItem.id ? String(activeItem.id) : null;
            
            if (tmdbIdStr && !localWatchedCache.includes(tmdbIdStr)) localWatchedCache.push(tmdbIdStr);
            if (internalIdStr && !localWatchedCache.includes(internalIdStr)) localWatchedCache.push(internalIdStr);
            if (!localWatchedCache.includes(titleLower)) localWatchedCache.push(titleLower);
            localStorage.setItem('local_watched_cache', JSON.stringify(localWatchedCache));
            
            let customHistory = JSON.parse(localStorage.getItem('custom_watched_history')) || [];
            let customEntry = { id: internalIdStr || 'cust_' + Date.now(), title: activeItem.title, year: activeItem.year || '2026', overview: activeItem.overview || '', rating: activeItem.rating || '7.5', tmdbId: activeItem.tmdbId ? parseInt(activeItem.tmdbId) : null, played: true, hasFile: false, posterPath: activeItem.posterPath || '' };
            if (!customHistory.some(h => String(h.title).toLowerCase().trim() === titleLower || (tmdbIdStr && String(h.tmdbId) === tmdbIdStr))) { customHistory.push(customEntry); localStorage.setItem('custom_watched_history', JSON.stringify(customHistory)); }

            let exists = myCollection.some(m => String(m.id) === internalIdStr || (m.tmdbId && String(m.tmdbId) === tmdbIdStr) || String(m.title).toLowerCase().trim() === titleLower);
            if (exists) { myCollection.forEach(m => { if (String(m.id) === internalIdStr || String(m.tmdbId) === tmdbIdStr || String(m.title).toLowerCase().trim() === titleLower) m.played = true; }); }
            else { myCollection.unshift(customEntry); }
            localStorage.setItem('local_collection', JSON.stringify(myCollection)); modalOpen = false; render();
        }

        function executeRemoveFromWatched() {
            if (!activeItem) return;
            let titleLower = String(activeItem.title).toLowerCase().trim();
            let tmdbIdStr = activeItem.tmdbId ? String(activeItem.tmdbId) : null, internalIdStr = activeItem.id ? String(activeItem.id) : null;
            
            localWatchedCache = localWatchedCache.filter(item => { let m = String(item).toLowerCase().trim(); return m !== titleLower && m !== tmdbIdStr && m !== internalIdStr; });
            localStorage.setItem('local_watched_cache', JSON.stringify(localWatchedCache));
            
            let customHistory = JSON.parse(localStorage.getItem('custom_watched_history')) || [];
            customHistory = customHistory.filter(h => String(h.title).toLowerCase().trim() !== titleLower && (!tmdbIdStr || String(h.tmdbId) !== tmdbIdStr));
            localStorage.setItem('custom_watched_history', JSON.stringify(customHistory));
            
            myCollection = myCollection.filter(m => String(m.id) !== internalIdStr && (!internalIdStr || !String(m.id).startsWith('cust_')));
            myCollection.forEach(m => { if (String(m.id) === internalIdStr || String(m.tmdbId) === tmdbIdStr || String(m.title).toLowerCase().trim() === titleLower) m.played = false; });
            localStorage.setItem('local_collection', JSON.stringify(myCollection)); modalOpen = false; render();
        }

        async function triggerUniversalSearch(queryText) {
            let tk = localStorage.getItem('tmdb_key'); if (!queryText.trim() || !tk) { searchResultsData = []; render(); return; }
            try {
                let url = `https://api.themoviedb.org/3/search/movie?api_key=${tk}&query=${encodeURIComponent(queryText.trim())}&with_original_language=en`;
                let data = await (await fetch(url)).json();
                if (data.results) { searchResultsData = data.results.map(m => ({ title: m.title, year: m.release_date ? m.release_date.substring(0,4) : 'N/A', rating: m.vote_average ? m.vote_average.toFixed(1) : 'NR', tmdbId: m.id, posterPath: m.poster_path ? `https://image.tmdb.org/t/p/w200${m.poster_path}` : '', overview: m.overview || '' })); }
            } catch (e) { console.error(e); }
            render();
        }

        function injectInlineTrailerFrame() {
            let trigger = document.getElementById("modal-trailer-trigger"); let frameBox = document.getElementById("modal-trailer-frame-box");
            if (trigger && frameBox && activeItem && activeItem.trailerKey) { trigger.style.display = "none"; frameBox.style.display = "block"; frameBox.innerHTML = `<iframe src="https://www.youtube.com/embed/${activeItem.trailerKey}?autoplay=1&modestbranding=1&rel=0" style="width:100%; height:100%; border:none;" allow="autoplay; encrypted-media" allowfullscreen></iframe>`; }
        }

        async function sendToRadarr() {
            if (!activeItem) return;
            let u = localStorage.getItem('radarr_url'), k = localStorage.getItem('radarr_key'); if (!u || !k) return alert("Configure Settings!");
            try {
                let f = await (await fetch(`${u.replace(/\/$/, "")}/api/v3/rootfolder?apiKey=${k}`)).json();
                let profiles = await (await fetch(`${u.replace(/\/$/, "")}/api/v3/qualityprofile?apiKey=${k}`)).json();
                let l = await (await fetch(`${u.replace(/\/$/, "")}/api/v3/movie/lookup?term=tmdb:${activeItem.tmdbId || 238}&apiKey=${k}`)).json();
                let movieData = Array.isArray(l) ? l[0] : l; if (!movieData) return alert("Missing metadata.");
                movieData.rootFolderPath = f[0].path; movieData.qualityProfileId = profiles[0].id; movieData.monitored = true; movieData.addOptions = { searchForMovie: true };
                let postRes = await fetch(`${u.replace(/\/$/, "")}/api/v3/movie?apiKey=${k}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(movieData) });
                if (postRes.status === 201 || postRes.status === 200) { alert(`Added to queue!`); modalOpen = false; await syncRadarrLibrary(); }
                else { alert("Exists or Rejected."); }
            } catch(err) { alert("Connection Timeout."); }
            render();
        }

        async function syncRadarrLibrary() {
            let u = localStorage.getItem('radarr_url'), k = localStorage.getItem('radarr_key'); if (!u || !k) return;
            isRadarrLoading = true; render();
            try {
                let response = await fetch(`${u.replace(/\/$/, "")}/api/v3/movie?apiKey=${k}`);
                let items = await response.json();
                if (Array.isArray(items)) {
                    let serverItems = items.map((item) => {
                        let tmdbIdStr = item.tmdbId ? String(item.tmdbId) : null;
                        let matchPlayed = localWatchedCache.includes(tmdbIdStr) || localWatchedCache.includes(String(item.title).toLowerCase().trim());
                        let posterObj = item.images?.find(i => i.coverType === 'poster');
                        return { id: String(item.id), title: item.title, year: item.year || 'N/A', overview: item.overview || '', rating: item.ratings?.value ? item.ratings.value.toFixed(1) : '7.5', tmdbId: item.tmdbId || null, played: matchPlayed, hasFile: item.hasFile, posterPath: posterObj ? (posterObj.remoteUrl || posterObj.url) : '' };
                    });
                    let customHistory = JSON.parse(localStorage.getItem('custom_watched_history')) || [];
                    customHistory.forEach(historicMatch => {
                        let tmdbIdStr = historicMatch.tmdbId ? String(historicMatch.tmdbId) : null;
                        let found = serverItems.some(s => tmdbIdStr ? (String(s.tmdbId) === tmdbIdStr) : s.title.toLowerCase().trim() === historicMatch.title.toLowerCase().trim());
                        if (!found) { serverItems.unshift(historicMatch); }
                    });
                    myCollection = serverItems; localStorage.setItem('local_collection', JSON.stringify(myCollection));
                }
            } catch(e) { alert("Sync Failed: " + e.message); }
            isRadarrLoading = false; render();
        }
          async function loadDiscoverTracks() {
            let tk = localStorage.getItem('tmdb_key'); if (!tk) return;
            let genres = { "Action": "28", "Comedy": "35", "Drama": "18", "Adventure": "12", "Mystery": "9648", "Sci-Fi": "878" };
            let decades = { "1960s": [1960, 1969], "1970s": [1970, 1979], "1980s": [1980, 1989], "1990s": [1990, 1999], "2000s": [2000, 2009] };
            try {
                for (let [title, gId] of Object.entries(genres)) {
                    let res1 = await (await fetch("https://api.themoviedb.org/3/discover/movie?api_key=" + tk + "&with_genres=" + gId + "&sort_by=popularity.desc&with_original_language=en&page=1")).json();
                    tracks[title] = (res1.results || []).map(m => ({ title: m.title, year: m.release_date?.substring(0,4) || '', rating: m.vote_average ? m.vote_average.toFixed(1) : '7.0', tmdbId: m.id, posterPath: m.poster_path ? "https://image.tmdb.org/t/p/w200" + m.poster_path : '', overview: m.overview || '' }));
                }
                for (let [title, range] of Object.entries(decades)) {
                    let res1 = await (await fetch("https://api.themoviedb.org/3/discover/movie?api_key=" + tk + "&primary_release_date.gte=" + range[0] + "-01-01&primary_release_date.lte=" + range[1] + "-12-31&sort_by=vote_average.desc&vote_count.gte=500&with_original_language=en&page=1")).json();
                    tracks[title] = (res1.results || []).map(m => ({ title: m.title, year: m.release_date?.substring(0,4) || '', rating: m.vote_average ? m.vote_average.toFixed(1) : '7.0', tmdbId: m.id, posterPath: m.poster_path ? "https://image.themoviedb.org/t/p/w200" + m.poster_path : '', overview: m.overview || '' }));
                }
                if (currentTab === 'foryou') render();
            } catch(e) {}
        }

        async function syncFeeds() {
            let links = localStorage.getItem('lb_links'), tk = localStorage.getItem('tmdb_key'); if (!links) return;
            let arr = links.split(','), blended = [];
            for (let l of arr) {
                let user = l.trim().replace(/\/$/, ""); if (!user) continue;
                if (user.includes('letterboxd.com/')) user = user.split('letterboxd.com/')[1];
                user = user.replace(/^\//, "").trim().toLowerCase(); if (!user) continue;
                try {
                    let targetUrl = "https://letterboxd.com/" + user + "/rss/?_cb=" + new Date().getTime();
                    let res = await fetch("https://corsproxy.io/?" + encodeURIComponent(targetUrl));
                    let textXml = await res.text(); if (!textXml || textXml.trim() === '') continue;
                    let items = new DOMParser().parseFromString(textXml, "text/xml").getElementsByTagName("item");
                    for (let i = 0; i < Math.min(items.length, 25); i++) {
                        let t = (items[i].getElementsByTagName("title")[0]?.textContent || '').split(' - ')[0];
                        if (t && !blended.some(m => m.title === t)) {
                            let itemObj = { id: 'lb_'+user+'_'+i, title: t, year: '@'+user, rating: 'Pick', tmdbId: 238, posterPath: '', overview: '' };
                            blended.push(itemObj);
                            if (tk) {
                                let cleanQuery = t.match(/^(.+?),\s*(\d{4})$/) ? t.match(/^(.+?),\s*(\d{4})$/)[1].trim() : t;
                                fetch("https://api.themoviedb.org/3/search/movie?api_key=" + tk + "&query=" + encodeURIComponent(cleanQuery))
                                    .then(r => r.json()).then(s => { if (s.results?.[0]) { itemObj.tmdbId = s.results[0].id; itemObj.posterPath = "https://image.tmdb.org/t/p/w200" + s.results[0].poster_path; itemObj.overview = s.results[0].overview || ''; render(); } }).catch(()=>{});
                            }
                        }
                    }
                } catch(e) {}
            }
            for (let i = blended.length - 1; i > 0; i--) { let j = Math.floor(Math.random() * (i + 1)), temp = blended[i]; blended[i] = blended[j]; blended[j] = temp; }
            friendRowData = blended; render();
        }

        function renderRow(title, movies, isFriend = false) {
            let rowType = isFriend ? 'friend' : 'discover';
            let displayList = movies.filter(m => !localWatchedCache.includes(String(m.title).toLowerCase().trim()) && (!m.tmdbId || !localWatchedCache.includes(String(m.tmdbId))));
            if (displayList.length === 0) return '';
            return `<div class="row-container"><h3 class="row-title">${isFriend ? '🔥' : '🎬'} ${title}</h3><div class="scroll-row">` + displayList.map((m, idx) => `<div class="scroll-card movie-trigger" data-pool="${rowType}" data-key="${idx}" data-track="${title}"><div class="scroll-poster" style="${m.posterPath ? `background:url('${m.posterPath}') center/cover no-repeat;` : ''}">${m.posterPath ? '' : `<div style="font-weight:bold; font-size:10px; padding:12px;">${m.title}</div>`}<span class="rating-badge">${m.rating}</span></div><div class="card-details"><div class="card-title">${m.title}</div><div class="card-meta">${m.year}</div></div></div>`).join('') + `</div></div>`;
        }

        function render() {
            let out = document.getElementById('view-root'), body = '', modal = '';
            let searchRowHtml = searchResultsData.length > 0 ? `<div class="row-container"><h3 class="row-title">🎬 Search Results</h3><div class="scroll-row">` + searchResultsData.map((m, idx) => `<div class="scroll-card movie-trigger" data-pool="search" data-key="${idx}"><div class="scroll-poster" style="${m.posterPath ? `background:url('${m.posterPath}') center/cover no-repeat;` : ''}"></div><div class="card-details"><div class="card-title">${m.title}</div><div class="card-meta">${m.year}</div></div></div>`).join('') + `</div></div>` : '';
            if (currentTab === 'collection') {
                let watchedMovies = myCollection.filter(m => m.played === true || localWatchedCache.includes(String(m.tmdbId)) || localWatchedCache.includes(String(m.title).toLowerCase().trim()));
                let downloadedMovies = myCollection.filter(m => m.hasFile === true);
                let comingSoonMovies = myCollection.filter(m => !m.hasFile && !m.played);
                let filteredCollection = currentSubTab === 'watched' ? watchedMovies : (currentSubTab === 'downloaded' ? downloadedMovies : comingSoonMovies);
                body = searchRowHtml + `<div class="stats-grid"><div onclick="switchSubTab('watched')" class="stat-card ${currentSubTab === 'watched' ? 'active-sub-tab' : ''}"><div class="stat-num" style="color:#a855f7;">${watchedMovies.length}</div><div class="stat-lbl">Watched</div></div><div onclick="switchSubTab('downloaded')" class="stat-card ${currentSubTab === 'downloaded' ? 'active-sub-tab' : ''}"><div class="stat-num" style="color:#10b981;">${downloadedMovies.length}</div><div class="stat-lbl">Downloaded</div></div><div onclick="switchSubTab('comingsoon')" class="stat-card ${currentSubTab === 'comingsoon' ? 'active-sub-tab' : ''}"><div class="stat-num" style="color:#3b82f6;">${comingSoonMovies.length}</div><div class="stat-lbl">Coming Soon</div></div></div><hr class="section-divider"><div style="display:flex; justify-content:space-between; margin-bottom:16px; align-items:center;"><h2 style="font-size:12px; color:#94a3b8; text-transform:uppercase; margin:0;">Library (${filteredCollection.length})</h2><button onclick="syncRadarrLibrary();" style="background:#1e293b; color:#cbd5e1; border:1px solid #334155; font-size:10px; padding:4px 8px; border-radius:6px; cursor:pointer;">🔄 Sync</button></div>` + (isRadarrLoading ? `<div style="text-align:center; font-size:12px; padding:40px; color:#64748b;">Syncing...</div>` : `<div class="movie-grid">${filteredCollection.length === 0 ? `<div style="grid-column:span 2; text-align:center; padding:35px; color:#64748b; font-size:12px;">Empty category.</div>` : filteredCollection.map((m) => `<div class="movie-card movie-trigger" data-pool="library" data-key="${m.id}"><div class="poster-slot">${m.posterPath ? `<img class="grid-poster-img" src="${m.posterPath}">` : `<div style="font-weight:bold; font-size:10px; padding:12px;">${m.title}</div>`}</div><div class="grid-card-details">${m.title}</div></div>`).join('')}</div>`);
            } else if (currentTab === 'foryou') {
                body = searchRowHtml + renderRow("Friends' Watchlist Picks", friendRowData, true) + `<hr class="section-divider"><h2 style="font-size:12px; color:#94a3b8; text-transform:uppercase; margin-bottom:16px;">Curation Tracks</h2>` + Object.entries(tracks).map(([title, movies]) => renderRow(title, movies)).join('');
            } else if (currentTab === 'downloads') {
                body = `<div style="display:flex; justify-content:space-between; margin-bottom:16px; align-items:center;"><h2 style="font-size:12px; color:#64748b; text-transform:uppercase; margin:0;">Active Transfers (${activeTorrents.length})</h2><button onclick="syncQBittorrentList();" style="background:#ffffff; color:#334155; border:1px solid #cbd5e1; font-size:10px; padding:6px 10px; border-radius:6px; cursor:pointer; font-weight:bold;">🔄 Refresh</button></div><hr class="section-divider">` + (activeTorrents.length === 0 ? `<div style="text-align:center; padding:40px; color:#64748b; font-size:13px; font-weight:600;">No active torrent transfers running.</div>` : activeTorrents.map(t => `<div class="torrent-card"><div class="torrent-title">${t.name}</div><div class="torrent-progress-bg"><div class="torrent-progress-fill" style="width:${t.progress}%;"></div></div><div class="torrent-meta"><span>⬇️ ${t.speed} MB/s (${t.progress}%)</span><span>${t.size} GB [${t.status}]</span></div></div>`).join(''));
            } else if (currentTab === 'settings') {
                body = `<div class="settings-container"><div class="form-group"><label>Radarr URL</label><input type="text" id="in_radarr_url" value="${localStorage.getItem('radarr_url')||''}"></div><div class="form-group"><label>Radarr Key</label><input type="password" id="in_radarr_key" value="${localStorage.getItem('radarr_key')||''}"></div><div class="form-group"><label>qBittorrent URL (Local / Tailscale)</label><input type="text" id="in_qbit_url" value="${localStorage.getItem('qbit_url')||''}" placeholder="http://100.x.x.x:8080"></div><div class="form-group"><label>Letterboxd Usernames</label><textarea id="in_lb">${localStorage.getItem('lb_links')||''}</textarea></div><div class="form-group"><label>TMDB Key (v3)</label><input type="text" id="in_tmdb" value="${localStorage.getItem('tmdb_key')||''}"></div><hr class="section-divider"><button onclick="localStorage.setItem('radarr_url', document.getElementById('in_radarr_url').value.trim()); localStorage.setItem('radarr_key', document.getElementById('in_radarr_key').value.trim()); localStorage.setItem('qbit_url', document.getElementById('in_qbit_url').value.trim()); localStorage.setItem('lb_links', document.getElementById('in_lb').value.trim()); localStorage.setItem('tmdb_key', document.getElementById('in_tmdb').value.trim()); alert('Saved Configuration!'); syncRadarrLibrary(); syncFeeds(); loadDiscoverTracks(); syncQBittorrentList();" class="btn-action">Save Settings</button></div>`;
            }
            if (modalOpen && activeItem) {
                let displayTmdbScore = activeItem.vote_average || activeItem.rating || '7.4';
                let radarrButtonHtml = myCollection.some(c => String(c.tmdbId) === String(activeItem.tmdbId)) ? `<button class="btn-panel-disabled" disabled>🔒 In Radarr</button>` : `<button onclick="sendToRadarr()" class="btn-panel-primary">Add to Radarr</button>`;
                modal = `<div class="modal-overlay"><div class="btn-unwatch-action" onclick="executeRemoveFromWatched()">✕ Unwatch</div><div class="detail-close-trigger" onclick="closeM()">×</div><div class="detail-hero-backdrop" style="${activeItem.backdrop_path ? `background-image:url('${activeItem.backdrop_path}');` : `background:#cbd5e1;`}"></div><div class="detail-content-frame"><div class="detail-main-row"><div class="detail-poster-wrapper"><img class="detail-poster-img" src="${activeItem.posterPath || ''}"></div><div class="detail-meta-block"><h3 class="detail-heading-title">${activeItem.title}</h3><div class="detail-sub-specs">${activeItem.year}</div><button id="modal-trailer-trigger" class="trailer-btn" onclick="injectInlineTrailerFrame()" style="${activeItem.trailerKey ? 'display:block;' : 'display:none;'}">🎬 Play Trailer</button></div></div><div id="modal-trailer-frame-box" class="trailer-video-box"></div><div class="detail-metrics-rack"><div class="metric-pill">⭐ TMDB: <span>${displayTmdbScore}</span></div></div><div class="detail-synopsis-box"><h4>Summary</h4><p>${activeItem.overview || 'No overview available.'}</p></div><div class="detail-footer-actions"><button onclick="executeToggleWatched()" class="btn-panel-primary">Mark Watched</button>${radarrButtonHtml}</div></div></div>`;
            }
            out.innerHTML = `<div class="header"><div class="search-wrapper"><input type="text" id="search-input" class="search-input-field" placeholder="Search any movie..." onkeyup="if(event.key === 'Enter') triggerUniversalSearch(this.value)" value="${document.getElementById('search-input') ? document.getElementById('search-input').value : ''}"></div></div>${body}${modal}
            <div class="nav-footer">
                <button onclick="switchTab('collection')" class="nav-btn ${currentTab === 'collection' ? 'active' : ''}">
                    <div class="nav-icon-wrapper"><svg class="nav-svg-icon" viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg></div>
                    Movies
                </button>
                <button onclick="switchTab('foryou')" class="nav-btn ${currentTab === 'foryou' ? 'active' : ''}">
                    <div class="nav-icon-wrapper"><svg class="nav-svg-icon" viewBox="0 0 24 24"><path d="M12 11.55C9.64 9.35 6.48 8 3 8v11c3.48 0 6.64 1.35 9 3.55 2.36-2.2 5.52-3.55 9-3.55V8c-3.48 0-6.64 1.35-9 3.55zM12 2c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3z"/></svg></div>
                    For You
                </button>
                <button onclick="switchTab('downloads')" class="nav-btn ${currentTab === 'downloads' ? 'active' : ''}">
                    <div class="nav-icon-wrapper"><svg class="nav-svg-icon" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg></div>
                    Downloads
                </button>
                <button onclick="switchTab('settings')" class="nav-btn ${currentTab === 'settings' ? 'active' : ''}">
                    <div class="nav-icon-wrapper"><svg class="nav-svg-icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.16.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.16-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></div>
                    Settings
                </button>
            </div>`;
        }

        document.addEventListener('click', function (e) { let triggerCard = e.target.closest('.movie-trigger'); if (triggerCard) { launchModalFromAttributes(triggerCard.getAttribute('data-pool'), triggerCard.getAttribute('data-key'), triggerCard.getAttribute('data-track')); } });
        window.addEventListener('touchstart', (e) => { if (window.scrollY === 0 && currentTab === 'foryou') { startY = e.touches[0].clientY; isPulling = true; } });
        window.addEventListener('touchmove', (e) => { if (!isPulling) return; let diff = e.touches[0].clientY - startY; if (diff > 0) { if (e.cancelable) e.preventDefault(); let el = document.getElementById('pull-indicator'); if (el) { el.style.height = Math.min(diff * 0.4, 50) + 'px'; el.innerText = diff * 0.4 >= 45 ? "🔄 Release..." : "⬇️ Pull..."; } } });
        window.addEventListener('touchend', async () => { if (!isPulling) return; isPulling = false; let el = document.getElementById('pull-indicator'); if (!el) return; if (parseInt(el.style.height || '0') >= 45) { el.innerText = "⚡ Syncing..."; await syncFeeds(); await loadDiscoverTracks(); } el.style.height = '0px'; });
        setInterval(syncQBittorrentList, 6000);
        if(localStorage.getItem('radarr_url')&&localStorage.getItem('radarr_key')) syncRadarrLibrary();
        syncFeeds(); loadDiscoverTracks(); render();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Movie Tracker Dashboard</title>
    <style>
        html, body { background: linear-gradient(180deg, #f1f5f9 0%, #e2e8f0 100%); color: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 12px 8px 125px 8px; box-sizing: border-box; }
        .header { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .search-input { width: 100%; padding: 14px; border-radius: 14px; border: 1px solid #cbd5e1; box-sizing: border-box; }
        .nav-footer { position: fixed; bottom: 0; left: 0; right: 0; height: 86px; background: rgba(255, 255, 255, 0.9); border-top: 1px solid #cbd5e1; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); backdrop-filter: blur(10px); z-index: 1000; }
        .nav-btn { background: none; border: none; font-weight: 800; font-size: 11px; text-transform: uppercase; color: #64748b; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .nav-btn.active { color: #f97316; }
        .torrent-card { background: white; border: 1px solid #cbd5e1; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .btn-stop { background: linear-gradient(90deg, #f97316 0%, #ea580c 100%); color: white; border: none; padding: 12px; border-radius: 10px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 8px; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #f97316; color: white; padding: 12px 24px; border-radius: 14px; z-index: 2000; display: none; font-weight: 800; }
        .movie-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .movie-card { background: white; padding: 10px; border-radius: 14px; border: 1px solid #cbd5e1; }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>
    <div class="header" id="header">
        <input type="text" class="search-input" id="search" placeholder="Search movies...">
    </div>
    <div id="view-root"></div>
    <div class="nav-footer">
        <button class="nav-btn" id="nav-movies" onclick="switchTab('collection')">Movies</button>
        <button class="nav-btn" id="nav-foryou" onclick="switchTab('foryou')">For You</button>
        <button class="nav-btn" id="nav-downloads" onclick="switchTab('downloads')">Downloads</button>
        <button class="nav-btn" id="nav-settings" onclick="switchTab('settings')">Settings</button>
    </div>
    <script>
        let currentTab = localStorage.getItem('app_current_tab') || 'collection';

        function showToast(msg) { let t = document.getElementById('toast'); t.innerText = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }
        
        function switchTab(t) { 
            localStorage.setItem('app_current_tab', t); 
            currentTab = t; 
            render(); 
        }

        async function syncDownloads() {
            let u = localStorage.getItem('radarr_url'), k = localStorage.getItem('radarr_key');
            if(!u || !k) return;
            try {
                let res = await fetch(`${u.replace(/\/$/, "")}/api/v3/queue?apiKey=${k}`);
                let list = await res.json();
                let records = Array.isArray(list) ? list : (list.records || []);
                document.getElementById('view-root').innerHTML = records.map(t => `
                    <div class="torrent-card">
                        <div style="font-weight:700;">${t.title}</div>
                        <div style="font-size:12px; color:#64748b;">${t.status}</div>
                        <button class="btn-stop" onclick="toggleTransfer('${t.id}', '${t.status}')">Toggle Status</button>
                    </div>
                `).join('');
            } catch(e) { showToast("Connection Error"); }
        }

        async function toggleTransfer(id, status) {
            let u = localStorage.getItem('radarr_url'), k = localStorage.getItem('radarr_key');
            let action = (status.toLowerCase().includes('paused') || status.toLowerCase().includes('stop')) ? 'resume' : 'pause';
            try {
                await fetch(`${u.replace(/\/$/, "")}/api/v3/queue/${action}?apiKey=${k}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ queueItemIds: [parseInt(id)] })
                });
                showToast("Command Sent");
                setTimeout(syncDownloads, 1000);
            } catch(e) { showToast("Action Failed"); }
        }

        function render() {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`nav-${currentTab}`).classList.add('active');
            let root = document.getElementById('view-root');
            
            if(currentTab === 'collection') {
                root.innerHTML = `<div class="movie-grid"><div>My Movies Grid</div></div>`;
            } else if(currentTab === 'foryou') {
                root.innerHTML = "<div>For You Content</div>";
            } else if(currentTab === 'downloads') {
                syncDownloads();
            } else if(currentTab === 'settings') {
                root.innerHTML = `
                    <div class="settings-container" style="padding: 10px;">
                        <input type="text" id="r_url" placeholder="Radarr URL" style="width:100%; padding:10px; margin-bottom:10px;" value="${localStorage.getItem('radarr_url')||''}">
                        <input type="password" id="r_key" placeholder="API Key" style="width:100%; padding:10px; margin-bottom:10px;" value="${localStorage.getItem('radarr_key')||''}">
                        <button onclick="localStorage.setItem('radarr_url', document.getElementById('r_url').value); localStorage.setItem('radarr_key', document.getElementById('r_key').value); showToast('Saved!')" style="width:100%; padding:12px; background:#f97316; color:white; border:none; border-radius:8px;">Save Settings</button>
                    </div>
                `;
            }
        }
        render();
    </script>
</body>
</html>

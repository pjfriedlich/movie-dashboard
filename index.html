        let displayMonth = new Date().getMonth();

        window.changeMonth = function(dir) {
            displayMonth += dir;

            render();
        };

        function renderCalendarHTML() {
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            let firstDay = new Date(displayYear, displayMonth, 1).getDay();
            let daysInMonth = new Date(displayYear, displayMonth + 1, 0).getDate();

            let html = `
            <div class="calendar-nav">
                <button onclick="changeMonth(-1)" class="calendar-nav-btn">&lt;</button>
                <h4 class="calendar-nav-title">${monthNames[displayMonth]} ${displayYear}</h4>
                <button onclick="changeMonth(1)" class="calendar-nav-btn">&gt;</button>
            </div>
            <div class="calendar-grid">`;
            
            ['S','M','T','W','T','F','S'].forEach(day => {
                html += `<div class="calendar-header-day">${day}</div>`;
            });

            let prevMonthDays = new Date(displayYear, displayMonth, 0).getDate();
            for (let i = 0; i < firstDay; i++) {
                let d = prevMonthDays - firstDay + i + 1;
                html += `<div class="calendar-cell inactive-cell"><div class="calendar-date">${d}</div></div>`;
            }

            let today = new Date();
            for (let i = 1; i <= daysInMonth; i++) {
                let isToday = today.getDate() === i && today.getMonth() === displayMonth && today.getFullYear() === displayYear;
                let dateStr = `${displayYear}-${String(displayMonth+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;

                let dayEventsHTML = '';
                calendarEvents.forEach(ev => {
                    let isMatch = false;
                    let evDateStr = ev.date ? `${ev.date.getFullYear()}-${String(ev.date.getMonth()+1).padStart(2,'0')}-${String(ev.date.getDate()).padStart(2,'0')}` : null;

                    if (evDateStr === dateStr) isMatch = true;

                    if (isMatch) {
                        dayEventsHTML += `<div class="calendar-event movie-trigger" data-pool="calendar" data-id="${ev.id}" style="background:${ev.color}; color:${ev.textColor || '#ffffff'};">${ev.title}</div>`;
                    }
                });

                html += `
                <div class="calendar-cell ${isToday ? 'today-cell' : ''}">
                    <div class="calendar-date">${i}</div>
                    ${dayEventsHTML}
                </div>`;
            }

            let totalCells = firstDay + daysInMonth;
            let remaining = (7 - (totalCells % 7)) % 7;
            for (let i = 1; i <= remaining; i++) {
                html += `<div class="calendar-cell inactive-cell"><div class="calendar-date">${i}</div></div>`;
            }

            html += `</div>`;
            return html;

                    if (event.status.type.state === 'pre') {

                        awayTeam: away.team.shortDisplayName, awayScore: away.score, awayLogo: away.team.logo, awayWinner: away.winner, isMets: isMets
                    };
                });
                
                sportsData.sort((a, b) => {
                    if (a.isMets && !b.isMets) return -1;

                    if (a.isLive && !b.isLive) return -1;
                    if (!a.isLive && b.isLive) return 1;

            finally { isSportsLoading = false; if (currentTab === 'smarthome') render(); }

        async function syncJfSessions() {
            let u = localStorage.getItem('jf_url'); let k = localStorage.getItem('jf_key');
            if(!u || !k) return; u = u.trim().replace(/\/$/, ""); if(!u.startsWith('http')) u = 'http://' + u;
            try {
                let res = await fetch(`${u}/Sessions?api_key=${k.trim()}`); let data = await res.json();
                let filtered = data.filter(s => s.Client !== 'Jellyfin Server' && s.DeviceId !== 'server' && s.NowPlayingItem);
                
                filtered = filtered.map(s => {
                    let health = "🟢 Direct Play"; let reason = ""; let pm = s.PlayState?.PlayMethod; 
                    if (pm === "Transcode") {
                        let fps = s.TranscodingInfo?.Framerate || 30;
                        let reasonsArr = s.TranscodingInfo?.TranscodeReasons || [];
                        let reasonStr = reasonsArr.map(r => r.replace(/([A-Z])/g, ' $1').trim()).join(', ') || "Format not supported";
                        if (fps < 24) { health = `🔴 Transcoding (Bottleneck)`; reason = `Server too slow (${Math.round(fps)} fps). ${reasonStr}`; } 
                        else { health = `🟡 Transcoding`; reason = reasonStr; }
                    } else if (pm === "DirectStream") { health = `🟡 Direct Stream`; reason = "Remuxing container"; }
                    
                    let vidStream = s.NowPlayingItem?.MediaStreams?.find(m => m.Type === 'Video');
                    let width = vidStream ? vidStream.Width : s.NowPlayingItem?.Width; let resText = '';
                    if (width) {
                        if (width >= 3840) resText = '4K'; else if (width >= 1920) resText = '1080p';
                        else if (width >= 1280) resText = '720p'; else resText = 'SD';
                    }
                    s.streamHealth = health; s.streamReason = reason; s.streamResText = resText;
                    return s;
                });
                
                filtered.forEach(s => {
                    let existingIdx = jfHistory.findIndex(h => h.Id === s.Id);
                    if(existingIdx >= 0) { jfHistory[existingIdx] = s; } else { jfHistory.unshift(s); }
                });
                if (jfHistory.length > 20) jfHistory = jfHistory.slice(0, 20);
                localStorage.setItem('jf_history', JSON.stringify(jfHistory));
                
                let oldIds = jfActiveSessions.map(s => s.Id).join(','); let newIds = filtered.map(s => s.Id).join(',');
                let oldHealth = jfActiveSessions.map(s => s.streamHealth).join(','); let newHealth = filtered.map(s => s.streamHealth).join(',');
                
                jfActiveSessions = filtered;
                if(currentTab === 'smarthome' && !modalOpen && (oldIds !== newIds || oldHealth !== newHealth)) render();
            } catch(e) {}
        }

                    let res = await fetch(`${rUrl.trim().replace(/\/$/, "")}/api/v3/calendar?apiKey=${rKey.trim()}&start=${startStr}&end=${endStr}&unmonitored=false`);
                    let movies = await res.json();
                    if (Array.isArray(movies)) {
                        movies.forEach(m => {
                            let posterObj = m.images?.find(i => i.coverType === 'poster') || m.images?.[0];
                            let poster = posterObj ? (posterObj.remoteUrl || posterObj.url) : '';
                            if (m.inCinemas) { newEvents.push({ id: 'rad_'+m.id+'_c', type: '🍿 Theatrical', title: `🍿 ${m.title}`, searchTitle: m.title, tmdbId: m.tmdbId, mediaType: 'movie', posterPath: poster, date: new Date(m.inCinemas), color: '#f59e0b' }); }
                            if (m.digitalRelease) { newEvents.push({ id: 'rad_'+m.id+'_d', type: '💻 Digital', title: `💻 ${m.title}`, searchTitle: m.title, tmdbId: m.tmdbId, mediaType: 'movie', posterPath: poster, date: new Date(m.digitalRelease), color: '#3b82f6' }); }
                            if (m.physicalRelease) { newEvents.push({ id: 'rad_'+m.id+'_p', type: '💿 Physical', title: `💿 ${m.title}`, searchTitle: m.title, tmdbId: m.tmdbId, mediaType: 'movie', posterPath: poster, date: new Date(m.physicalRelease), color: '#8b5cf6' }); }
                        });
                    }
                } catch(e) {}
            }

            if (sUrl && sKey) {
                try {
                    let res = await fetch(`${sUrl.trim().replace(/\/$/, "")}/api/v3/calendar?apiKey=${sKey.trim()}&start=${startStr}&end=${endStr}&unmonitored=false`);
                    let eps = await res.json();
                    if (Array.isArray(eps)) {
                        let sonarrGroups = {};
                        eps.forEach(e => {
                            let dt = new Date(e.airDateUtc || e.airDate); let dateStr = `${dt.getFullYear()}-${dt.getMonth()}-${dt.getDate()}`;
                            let sId = e.seriesId || 0; let key = `${dateStr}_${sId}`;
                            if (!sonarrGroups[key]) {
                                let sObj = seriesMap[sId] || e.series;
                                let fallbackName = sObj ? (sObj.title || 'Unknown Series') : 'Unknown Series';
                                let tmdbId = sObj ? sObj.tmdbId : null; let tvdbId = sObj ? sObj.tvdbId : null;
                                let posterObj = sObj?.images?.find(i => i.coverType === 'poster') || sObj?.images?.[0];
                                let poster = posterObj ? (posterObj.remoteUrl || posterObj.url) : '';
                                sonarrGroups[key] = {
                                    id: 'son_'+sId+'_'+dateStr, date: dt, seriesTitle: fallbackName,
                                    searchTitle: fallbackName, tmdbId: tmdbId, tvdbId: tvdbId, posterPath: poster, episodes: []
                                };
                            }
                            sonarrGroups[key].episodes.push(e);
                        });

                        Object.values(sonarrGroups).forEach(group => {
                            group.episodes.sort((a,b) => (a.seasonNumber - b.seasonNumber) || (a.episodeNumber - b.episodeNumber));
                            let epText = '';
                            if (group.episodes.length === 1) {
                                let ep = group.episodes[0]; epText = `S${String(ep.seasonNumber).padStart(2,'0')}E${String(ep.episodeNumber).padStart(2,'0')}`;
                            } else {
                                let first = group.episodes[0], last = group.episodes[group.episodes.length-1];
                                if (first.seasonNumber === last.seasonNumber) {
                                    epText = `S${String(first.seasonNumber).padStart(2,'0')}E${String(first.episodeNumber).padStart(2,'0')}-E${String(last.episodeNumber).padStart(2,'0')}`;
                                } else { epText = `${group.episodes.length} Eps`; }
                            }
                            newEvents.push({ 
                                id: group.id, type: 'TV', title: `📺 ${group.seriesTitle} ${epText}`, 
                                searchTitle: group.seriesTitle, tmdbId: group.tmdbId, tvdbId: group.tvdbId,
                                mediaType: 'tv', posterPath: group.posterPath, date: group.date, color: '#10b981' 
                            });
                        });
                    }
                } catch(e) {}
            }

            calendarEvents = newEvents;
            if (currentTab === 'smarthome' && !modalOpen) render();
        }
        
        async function sendTvCmd(cmd) {

            let tvEntity = localStorage.getItem('ha_tv_entity') || 'media_player.chromecast';
            let remoteId = tvEntity.trim().replace('media_player.', 'remote.');
            u = u.trim().replace(/\/$/, ""); if (!u.startsWith('http')) u = 'http://' + u;
            try {
                await fetch(`${u}/api/services/remote/send_command`, {
                    method: 'POST', headers: { 'Authorization': `Bearer ${k.trim()}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ entity_id: remoteId, command: cmd })
                });
            } catch(e) { showAppNotification("HA Remote Connection Error"); }

        async function wakeTvAndLaunchJellyfin() {
            let u = localStorage.getItem('ha_url') || ""; let k = localStorage.getItem('ha_key') || "";
            u = u.trim().replace(/\/$/, ""); k = k.trim();
            let tvEntity = localStorage.getItem('ha_tv_entity') || 'media_player.chromecast';
            if (!u || !k) return showAppNotification("Verify HA Settings First!");
            if (!u.startsWith('http')) u = 'http://' + u;
            showAppNotification("Waking TV & Launching Jellyfin...");
            try {
                let res = await fetch(`${u}/api/services/media_player/play_media`, {
                    method: 'POST', headers: { 'Authorization': `Bearer ${k}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ entity_id: tvEntity.trim(), media_content_type: 'app', media_content_id: 'org.jellyfin.androidtv' })
                });
                if(!res.ok) { showAppNotification("HA Wake failed: HTTP " + res.status); return; }
                setTimeout(() => { if (modalOpen && activeItem && typeof launchModalFromAttributes === 'function') launchModalFromAttributes('library', activeItem.id); }, 4000);
            } catch(e) { showAppNotification("Failed to connect to HA"); }
        }

        async function castToJellyfin(sessionId) {
            if (!activeItem || !activeItem.jellyfinId) return;
            let jfUrl = localStorage.getItem('jf_url') || ""; jfUrl = jfUrl.trim().replace(/\/$/, "");
            if(!jfUrl.startsWith('http')) jfUrl = 'http://' + jfUrl;
            let jfKey = localStorage.getItem('jf_key') || ""; jfKey = jfKey.trim();
            try {
                let res = await fetch(`${jfUrl}/Sessions/${sessionId}/Playing?ItemIds=${activeItem.jellyfinId}&PlayCommand=PlayNow&api_key=${jfKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' } });
                if (res.ok || res.status === 204) { showAppNotification("Casting to TV! 🍿"); closeM(); } 
                else { showAppNotification("Cast failed: HTTP " + res.status); }
            } catch(e) { showAppNotification("Connection Error: Check JF URL"); }
        }

        async function fetchHAEntities() {
            let u = localStorage.getItem('ha_url'); let k = localStorage.getItem('ha_key');
            if (!u || !k) return; u = u.trim(); if (!u.startsWith('http')) u = 'http://' + u; 
            try {
                let res = await fetch(`${u.replace(/\/$/, "")}/api/states`, { headers: { 'Authorization': `Bearer ${k.trim()}`, 'Content-Type': 'application/json' } });
                if (!res.ok) { showAppNotification(`HA Error: ${res.status} (Check Token)`); return; }
                let data = await res.json();
                if (Array.isArray(data)) { haEntities = data; localStorage.setItem('ha_entities', JSON.stringify(haEntities)); if(currentTab === 'smarthome') render(); }
            } catch(e) { showAppNotification("HA Connection Blocked (Check CORS/URL)"); }
        }

        async function toggleHAEntity(entityId, domain) {
            let u = localStorage.getItem('ha_url'); let k = localStorage.getItem('ha_key');
            if (!u || !k) return; u = u.trim(); if (!u.startsWith('http')) u = 'http://' + u; 
            try {
                await fetch(`${u.replace(/\/$/, "")}/api/services/${domain}/toggle`, {
                    method: 'POST', headers: { 'Authorization': `Bearer ${k.trim()}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ entity_id: entityId })
                });
                let target = haEntities.find(e => e.entity_id === entityId);
                if (target) { target.state = target.state === 'on' ? 'off' : 'on'; localStorage.setItem('ha_entities', JSON.stringify(haEntities)); render(); }
                setTimeout(fetchHAEntities, 1000); 
            } catch(e) {}
        }

        async function sendHAIntercom(message, entityId) {
            message = message.trim(); if (!message) return showAppNotification("Enter a message!");
            let u = localStorage.getItem('ha_url'); let k = localStorage.getItem('ha_key');
            if (!u || !k) return; u = u.trim(); if (!u.startsWith('http')) u = 'http://' + u; 
            try {
                let baseUrl = u.replace(/\/$/, ""); let headers = { 'Authorization': `Bearer ${k.trim()}`, 'Content-Type': 'application/json' };
                showAppNotification('Sending: "' + message + '"');
                await fetch(`${baseUrl}/api/services/media_player/turn_on`, { method: 'POST', headers: headers, body: JSON.stringify({ entity_id: entityId }) });
                await new Promise(r => setTimeout(r, 600));
                let ttsEngine = haEntities.find(e => e.entity_id.startsWith('tts.'));
                if (ttsEngine) { await fetch(`${baseUrl}/api/services/tts/speak`, { method: 'POST', headers: headers, body: JSON.stringify({ entity_id: ttsEngine.entity_id, media_player_entity_id: entityId, message: message }) }); }
                else { await fetch(`${baseUrl}/api/services/tts/google_translate_say`, { method: 'POST', headers: headers, body: JSON.stringify({ entity_id: entityId, message: message }) }); }
                document.getElementById('ha_tts_message').value = '';
            } catch(e) { showAppNotification("Failed to broadcast"); }
        }

                        <div class="movie-grid" style="margin-bottom: 30px;">
                            ${activeCollection.parts.map(m => {
                                let lookupKey = m.tmdbId || m.title;
                                return `<div class="movie-card movie-trigger" data-pool="collection_part" data-id="${lookupKey}">
                                    <div class="poster-slot">${m.posterPath ? `<img class="grid-poster-img" src="${m.posterPath}">` : `<div style="font-weight:bold; font-size:10px; padding:12px;">${m.title}</div>`}</div>
                                    <div class="grid-card-details">${m.title}</div>
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                </div>`;
            } else if (activeFriendName) {
                let username = activeFriendName.replace('@', '');
                let friendData = letterboxdData[username] || { highly_rated: [], other: [] };
                let tabNavHtml = `
                    <div class="profile-tab-container">
                        <button class="profile-tab-btn ${window.currentFriendTab === 'highlyRated' ? 'active' : ''}" onclick="window.currentFriendTab='highlyRated'; render();">Highly Rated (${friendData.highly_rated.length})</button>
                        <button class="profile-tab-btn ${window.currentFriendTab === 'recent' ? 'active' : ''}" onclick="window.currentFriendTab='recent'; render();">Recent (${friendData.other.length})</button>
                    </div>
                `;
                let tabContentHtml = '';
                if (window.currentFriendTab === 'highlyRated') {
                    if (friendData.highly_rated.length === 0) {
                        tabContentHtml = `<div style="color:#64748b; font-size:12px; text-align:center; padding:40px 20px;">No highly rated movies recently logged.</div>`;
                    } else {
                        tabContentHtml = `<ul style="list-style-type:none; padding:0; margin:0;">` + friendData.highly_rated.map(movie => `
                            <li class="movie-trigger" data-pool="friend" data-id="${movie.title.replace(/"/g, '&quot;')}" style="cursor:pointer; background:#ffffff; border:1px solid #cbd5e1; margin-bottom:10px; padding:16px; border-radius:12px; font-size:13px; border-left:4px solid #10b981; box-shadow:0 4px 6px rgba(0,0,0,0.02); color:#0f172a; transition: transform 0.1s ease;" onmousedown="this.style.transform='scale(0.98)'" onmouseup="this.style.transform='scale(1)'">
                                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                    <strong style="font-size:14px;">${movie.title}</strong>
                                    <span style="background:#f0fdf4; color:#15803d; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:800; white-space:nowrap; margin-left:8px;">${movie.rating} ⭐</span>
                                </div>
                                ${movie.review ? `<em style="color:#64748b; font-size:12px; font-weight:normal; margin-top:8px; display:block; line-height: 1.5; border-top: 1px dashed #e2e8f0; padding-top: 8px;">"${movie.review}"</em>`:''}
                            </li>
                        `).join('') + `</ul>`;
                    }
                } else if (window.currentFriendTab === 'recent') {
                    if (friendData.other.length === 0) {
                        tabContentHtml = `<div style="color:#64748b; font-size:12px; text-align:center; padding:40px 20px;">No other recent movies.</div>`;
                    } else {
                        tabContentHtml = `<ul style="list-style-type:none; padding:0; margin:0;">` + friendData.other.map(movie => `
                            <li class="movie-trigger" data-pool="friend" data-id="${movie.title.replace(/"/g, '&quot;')}" style="cursor:pointer; background:#ffffff; border:1px solid #cbd5e1; margin-bottom:10px; padding:16px; border-radius:12px; font-size:13px; border-left:4px solid #f97316; box-shadow:0 4px 6px rgba(0,0,0,0.02); color:#0f172a; transition: transform 0.1s ease;" onmousedown="this.style.transform='scale(0.98)'" onmouseup="this.style.transform='scale(1)'">
                                <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                                    <strong style="font-size:14px;">${movie.title}</strong>
                                    <span style="background:#fff7ed; color:#c2410c; padding:2px 8px; border-radius:12px; font-size:11px; font-weight:800; white-space:nowrap; margin-left:8px;">${movie.rating} ⭐</span>
                                </div>
                                ${movie.review ? `<em style="color:#64748b; font-size:12px; font-weight:normal; margin-top:8px; display:block; line-height: 1.5; border-top: 1px dashed #e2e8f0; padding-top: 8px;">"${movie.review}"</em>`:''}
                            </li>
                        `).join('') + `</ul>`;
                    }
                }
                modal = `<div class="modal-overlay">
                    <div class="modal-bg-tint" style="background:#f1f5f9; opacity:1;"></div>
                    <div class="detail-close-trigger" onclick="closeM()">×</div>
                    <div class="detail-content-frame" style="margin-top:0; padding: 64px 20px 20px 20px; overflow-y:hidden; display:flex; flex-direction:column; box-sizing:border-box;">
                        <h3 class="detail-heading-title" style="margin-bottom:8px; display:flex; align-items:center; gap:8px;">👤 ${activeFriendName}</h3>
                        ${tabNavHtml}
                        <div style="flex:1; overflow-y:auto; padding-bottom: 30px;">${tabContentHtml}</div>
                    </div>
                </div>`;
            }
            
            let searchContainerHtml = currentTab === 'media' ? `
                <div class="search-container-box">
                    <input type="text" id="search-input" class="search-input-field" placeholder="Search any movie or show..." onkeyup="if(event.key === 'Enter' && typeof triggerUniversalSearch === 'function') triggerUniversalSearch(this.value)" value="${existingSearchVal}">
                    <button id="search-clear-trigger" onclick="clearSearchInput()" class="clear-search-btn" style="display: ${clearBtnStyle};">✕</button>
                </div>
            ` : '';

            let headerHtml = searchContainerHtml !== '' ? `
                <div class="header" style="border-bottom: none; padding-bottom: 0; margin-bottom: 5px;">
                    <div class="search-wrapper">${searchContainerHtml}</div>
                </div>
            ` : '';

            out.innerHTML = `
            ${headerHtml}
            ${searchResultsHtml}${body}${modal}
            `;
        }

        document.addEventListener('click', function (e) {
            let triggerCard = e.target.closest('.movie-trigger');
            let triggerMenu = e.target.closest('.menu-trigger') || e.target.matches('button[onclick^="toggleTorrentMenu"]');
            
            if (triggerCard) {
                e.preventDefault();
                let pool = triggerCard.getAttribute('data-pool');
                if (pool === 'person') {
                    if (typeof fetchPersonCredits === 'function') fetchPersonCredits(triggerCard.getAttribute('data-id'), triggerCard.getAttribute('data-name'));
                } else {
                    if (typeof launchModalFromAttributes === 'function') {
                        launchModalFromAttributes(
                            pool, 
                            triggerCard.getAttribute('data-id'), 
                            triggerCard.getAttribute('data-track')
                        );
                    }
                }
            } else if (e.target.matches('button[onclick*="toggleTorrentMenu"]')) {
                
            } else if (openMenuHash) {
                openMenuHash = null;
                render();
            }
        });

        function exportWatchedList() {
            const backupPayload = {
                watched: JSON.parse(localStorage.getItem('custom_watched_history') || '[]'),
                cache: JSON.parse(localStorage.getItem('local_watched_cache') || '[]'),
                collections: JSON.parse(localStorage.getItem('my_collections_cache') || '{}')
            };
            document.getElementById('migrationBox').value = JSON.stringify(backupPayload);
            document.getElementById('migrationBox').select();
            alert('All data exported! Copy the text inside the box now.');
        }

        function importWatchedList() {
            const dataToImport = document.getElementById('migrationBox').value.trim();
            if (!dataToImport) return alert('Please paste data into the box first.');
            try {
                let parsed = JSON.parse(dataToImport); 
                if (Array.isArray(parsed)) {
                    localStorage.setItem('custom_watched_history', dataToImport);
                    let cacheArr = parsed.map(m => String(m.title).toLowerCase().trim());
                    parsed.forEach(m => { if(m.tmdbId) cacheArr.push(String(m.tmdbId)); });
                    localStorage.setItem('local_watched_cache', JSON.stringify(cacheArr));
                } else {
                    if (parsed.watched) localStorage.setItem('custom_watched_history', JSON.stringify(parsed.watched));
                    if (parsed.cache) localStorage.setItem('local_watched_cache', JSON.stringify(parsed.cache));
                    if (parsed.collections) localStorage.setItem('my_collections_cache', JSON.stringify(parsed.collections));
                }
                alert('Success! Data imported. Refreshing...');
                location.reload();
            } catch (e) { alert('Invalid format.'); }
        }

        function safeInit() {
            try {
                if (localStorage.getItem('radarr_url') && localStorage.getItem('radarr_key')) {
                    if (typeof syncRadarrLibrary === 'function') syncRadarrLibrary();
                    if (typeof syncSonarrLibrary === 'function') syncSonarrLibrary();
                    if (typeof fetchDiskSpace === 'function') fetchDiskSpace();
                    if (typeof fetchMediaCalendars === 'function') fetchMediaCalendars();
                }
                if (localStorage.getItem('ha_key') && typeof fetchHAEntities === 'function') { fetchHAEntities(); }
                if (typeof syncFeeds === 'function') syncFeeds();
                if (typeof loadDiscoverTracks === 'function') loadDiscoverTracks();
                
                if (currentTab === 'smarthome') {
                    if (typeof fetchSportsScores === 'function') fetchSportsScores();
                    if (typeof fetchLocalWeather === 'function') fetchLocalWeather();
                    if (typeof fetchFamilyEvents === 'function') fetchFamilyEvents();
                }
            } catch (error) {
                console.error("Initialization Error:", error);
            }
        }

        render();
        safeInit();

        let tickCount = 0;
        setInterval(() => {
            if (typeof syncDownloadQueue === 'function') syncDownloadQueue();
            if (currentTab === 'smarthome' && typeof syncJfSessions === 'function') syncJfSessions();
            
            tickCount++;
            if (tickCount % 5 === 0) { 
                if (typeof fetchDiskSpace === 'function') fetchDiskSpace(); 
                if (currentTab === 'smarthome' && typeof fetchSportsScores === 'function') fetchSportsScores(); 
            }
            if (tickCount % 20 === 0) {
                if (typeof fetchMediaCalendars === 'function') fetchMediaCalendars();
                if (currentTab === 'smarthome') { 
                    if (typeof fetchLocalWeather === 'function') fetchLocalWeather(); 
                    if (typeof fetchFamilyEvents === 'function') fetchFamilyEvents(); 
                }
            }
        }, 3000);
    </script>
</body>
</html>

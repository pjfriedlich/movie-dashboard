        async function triggerUniversalSearch(query) {

                searchResultsData = (data.results || []).filter(r => r.media_type === 'movie' || r.media_type === 'tv').map(m => {
                    return {
                        id: m.id, tmdbId: m.id, title: m.title || m.name,

        function launchModalFromAttributes(pool, id, track) {
            activeItem = null;
            if (pool === 'discover_movie') {
                activeItem = (movieTracks[track] || []).find(m => String(m.id) === String(id));
            } else if (pool === 'discover_tv') {
                activeItem = (tvTracks[track] || []).find(m => String(m.id) === String(id));
            } else if (pool === 'search') {
                activeItem = searchResultsData.find(m => String(m.id) === String(id));
            } else if (pool === 'library' || pool === 'watched_track') {
                activeItem = myCollection.find(m => String(m.id) === String(id));
            } else if (pool === 'shows') {
                activeItem = myShows.find(m => String(m.id) === String(id));
            } else if (pool === 'friend') {
                activeItem = friendRowData.find(m => String(m.title) === String(id));
                if(activeItem && activeItem.mediaType === 'movie' && !activeItem.tmdbId) {
                    let tmdbKey = localStorage.getItem('tmdb_key');
                    if (tmdbKey) {
                        fetch(`https://api.themoviedb.org/3/search/movie?api_key=${tmdbKey}&query=${encodeURIComponent(activeItem.title)}`)
                        .then(r=>r.json()).then(d=>{
                            if(d.results && d.results[0]) {
                                activeItem.tmdbId = d.results[0].id;
                                activeItem.posterPath = d.results[0].poster_path ? 'https://image.tmdb.org/t/p/w500'+d.results[0].poster_path : '';
                                activeItem.overview = d.results[0].overview;
                                activeItem.rating = d.results[0].vote_average ? d.results[0].vote_average.toFixed(1) : '0.0';
                                render();
                            }
                        });
                    }
                }
            }
            if (activeItem) {
                modalOpen = true;
                render();
                
                let omdbKey = localStorage.getItem('omdb_key');
                if (omdbKey && !activeItem.omdbRatings) {
                    let yr = parseNumericYear(activeItem);
                    let url = `https://www.omdbapi.com/?apikey=${omdbKey.trim()}&t=${encodeURIComponent(activeItem.title)}${yr ? '&y='+yr : ''}`;

        async function fetchSportsScores() {
            let url = 'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard';
            try {
                isSportsLoading = true;
                if(currentTab === 'smarthome') render(); 
                let res = await fetch(url);
                let data = await res.json();
                sportsData = data.events.map(event => {
                    let comp = event.competitions[0];
                    let home = comp.competitors.find(c => c.homeAway === 'home');
                    let away = comp.competitors.find(c => c.homeAway === 'away');
                    let status = event.status.type.detail; 
                    if (event.status.type.state === 'pre') {
                        let d = new Date(event.date);
                        status = d.toLocaleTimeString([], {hour: 'numeric', minute:'2-digit'});
                    }
                    let isMets = home.team.abbreviation === 'NYM' || away.team.abbreviation === 'NYM';
                    return {
                        id: event.id, status: status, isLive: event.status.type.state === 'in',
                        homeTeam: home.team.shortDisplayName, homeScore: home.score, homeLogo: home.team.logo, homeWinner: home.winner,
                        awayTeam: away.team.shortDisplayName, awayScore: away.score, awayLogo: away.team.logo, awayWinner: away.winner, isMets: isMets
                    };
                });
                sportsData.sort((a, b) => {
                    if (a.isMets && !b.isMets) return -1;
                    if (!a.isMets && b.isMets) return 1;
                    if (a.isLive && !b.isLive) return -1;
                    if (!a.isLive && b.isLive) return 1;
                    return 0;
                });
            } catch(e) { console.error("Sports fetch error", e); } 
            finally { isSportsLoading = false; if (currentTab === 'smarthome') render(); }
        }

        async function fetchFamilyEvents() {
            try {
                let sgKey = localStorage.getItem('seatgeek_key'); let tmKey = localStorage.getItem('ticketmaster_key');
                if (!sgKey && !tmKey) { familyEventsData = []; isEventsLoading = false; if(currentTab === 'smarthome') render(); return; }
                isEventsLoading = true; if(currentTab === 'smarthome') render(); 
                let today = new Date(); let futureCutoff = new Date(); futureCutoff.setDate(today.getDate() + 45);
                let combinedEvents = [];
                if (sgKey) {
                    try {
                        let sgStart = today.toISOString().split('T')[0]; let sgEnd = futureCutoff.toISOString().split('T')[0];
                        let sgUrl = `https://api.seatgeek.com/2/events?client_id=${sgKey.trim()}&lat=40.75&lon=-73.80&range=35mi&datetime_local.gte=${sgStart}&datetime_local.lte=${sgEnd}&per_page=40&sort=datetime_local.asc`;
                        let sgRes = await fetch(sgUrl);
                        if (sgRes.ok) {
                            let sgData = await sgRes.json();
                            if (sgData.events) {
                                combinedEvents.push(...sgData.events.map(ev => {
                                    let eventDate = new Date(ev.datetime_local);
                                    return {
                                        rawDate: eventDate, source: (ev.type ? ev.type.replace('_', ' ') : 'Event') + ' (SeatGeek)', title: ev.short_title || ev.title,
                                        date: eventDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }),
                                        time: eventDate.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }),
                                        price: ev.stats?.lowest_price ? `$${ev.stats.lowest_price}+` : 'Tickets', location: ev.venue ? `${ev.venue.name} (${ev.venue.display_location})` : 'NYC Area', url: ev.url || ''
                                    };
                                }));
                            }
                        }
                    } catch (e) {}
                }
                if (tmKey) {
                    try {
                        let tmStart = today.toISOString().split('.')[0] + 'Z'; let tmEnd = futureCutoff.toISOString().split('.')[0] + 'Z';
                        let tmUrl = `https://app.ticketmaster.com/discovery/v2/events.json?apikey=${tmKey.trim()}&latlong=40.75,-73.80&radius=35&unit=miles&startDateTime=${tmStart}&endDateTime=${tmEnd}&sort=date,asc&size=40`;
                        let tmRes = await fetch(tmUrl);
                        if (tmRes.ok) {
                            let tmData = await tmRes.json();
                            if (tmData._embedded && tmData._embedded.events) {
                                combinedEvents.push(...tmData._embedded.events.map(ev => {
                                    let eventDate = new Date(ev.dates.start.dateTime || ev.dates.start.localDate);
                                    let venueName = ev._embedded?.venues?.[0] ? `${ev._embedded.venues[0].name} (${ev._embedded.venues[0].city?.name || ''})` : 'NYC Area';
                                    return {
                                        rawDate: eventDate, source: (ev.classifications?.[0]?.segment?.name || 'Event') + ' (Ticketmaster)', title: ev.name,
                                        date: eventDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }),
                                        time: eventDate.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }),
                                        price: ev.priceRanges?.[0] ? `$${ev.priceRanges[0].min}+` : 'Tickets', location: venueName, url: ev.url || ''
                                    };
                                }));
                            }
                        }
                    } catch (e) {}
                }
                combinedEvents.sort((a, b) => a.rawDate - b.rawDate);
                let uniqueEvents = []; let seen = new Set();
                for (let ev of combinedEvents) {
                    let key = ev.title.toLowerCase() + ev.date;
                    if (!seen.has(key) && !ev.title.toLowerCase().includes('chinese')) { seen.add(key); uniqueEvents.push(ev); }
                }
                familyEventsData = uniqueEvents;
            } catch (e) {} 
            finally { isEventsLoading = false; if (currentTab === 'smarthome') render(); }
        }
        async function syncJfSessions() {
            let u = localStorage.getItem('jf_url'); let k = localStorage.getItem('jf_key');
            if(!u || !k) return; u = u.trim().replace(/\/$/, ""); if(!u.startsWith('http')) u = 'http://' + u;
            try {
                let res = await fetch(`${u}/Sessions?api_key=${k.trim()}`); let data = await res.json();
                let filtered = data.filter(s => s.Client !== 'Jellyfin Server' && s.DeviceId !== 'server' && s.NowPlayingItem);
                filtered = filtered.map(s => {
                    let health = "🟢 Direct Play"; let reason = ""; let pm = s.PlayState?.PlayMethod; 
                    if (pm === "Transcode") {
                        let fps = s.TranscodingInfo?.Framerate || 30;
                        let reasonsArr = s.TranscodingInfo?.TranscodeReasons || [];
                        let reasonStr = reasonsArr.map(r => r.replace(/([A-Z])/g, ' $1').trim()).join(', ') || "Format not supported";
                        if (fps < 24) { health = `🔴 Transcoding (Bottleneck)`; reason = `Server too slow (${Math.round(fps)} fps). ${reasonStr}`; } 
                        else { health = `🟡 Transcoding`; reason = reasonStr; }
                    } else if (pm === "DirectStream") { health = `🟡 Direct Stream`; reason = "Remuxing container"; }
                    let vidStream = s.NowPlayingItem?.MediaStreams?.find(m => m.Type === 'Video');
                    let width = vidStream ? vidStream.Width : s.NowPlayingItem?.Width; let resText = '';
                    if (width) {
                        if (width >= 3840) resText = '4K'; else if (width >= 1920) resText = '1080p';
                        else if (width >= 1280) resText = '720p'; else resText = 'SD';
                    }
                    s.streamHealth = health; s.streamReason = reason; s.streamResText = resText;
                    return s;
                });
                filtered.forEach(s => {
                    let existingIdx = jfHistory.findIndex(h => h.Id === s.Id);
                    if(existingIdx >= 0) { jfHistory[existingIdx] = s; } else { jfHistory.unshift(s); }
                });
                if (jfHistory.length > 20) jfHistory = jfHistory.slice(0, 20);
                localStorage.setItem('jf_history', JSON.stringify(jfHistory));
                let oldIds = jfActiveSessions.map(s => s.Id).join(','); let newIds = filtered.map(s => s.Id).join(',');
                jfActiveSessions = filtered;
                if(currentTab === 'smarthome' && !modalOpen && oldIds !== newIds) render();
            } catch(e) {}
        }

        async function fetchMediaCalendars() {
            let rUrl = localStorage.getItem('radarr_url'); let rKey = localStorage.getItem('radarr_key');
            let sUrl = localStorage.getItem('sonarr_url'); let sKey = localStorage.getItem('sonarr_key');
            let dStart = new Date(); dStart.setMonth(dStart.getMonth() - 1);
            let startStr = dStart.getFullYear() + '-' + String(dStart.getMonth() + 1).padStart(2,'0') + '-01';
            let dEnd = new Date(); dEnd.setMonth(dEnd.getMonth() + 3);
            let endStr = dEnd.getFullYear() + '-' + String(dEnd.getMonth() + 1).padStart(2,'0') + '-01';
            let newEvents = []; let seriesMap = {};
            if (sUrl && sKey) {
                try { let sRes = await fetch(`${sUrl.trim().replace(/\/$/, "")}/api/v3/series?apiKey=${sKey.trim()}`); let sData = await sRes.json(); if (Array.isArray(sData)) { sData.forEach(s => seriesMap[s.id] = s); } } catch(e) {}
            }
            if (rUrl && rKey) {
                try {
                    let res = await fetch(`${rUrl.trim().replace(/\/$/, "")}/api/v3/calendar?apiKey=${rKey.trim()}&start=${startStr}&end=${endStr}&unmonitored=false`);
                    let movies = await res.json();
                    if (Array.isArray(movies)) {
                        movies.forEach(m => {
                            let posterObj = m.images?.find(i => i.coverType === 'poster') || m.images?.[0];
                            let poster = posterObj ? (posterObj.remoteUrl || posterObj.url) : '';
                            if (m.inCinemas) { newEvents.push({ id: 'rad_'+m.id+'_c', type: '🍿 Theatrical', title: `🍿 ${m.title}`, searchTitle: m.title, tmdbId: m.tmdbId, mediaType: 'movie', posterPath: poster, date: new Date(m.inCinemas), color: '#f59e0b' }); }
                            if (m.digitalRelease) { newEvents.push({ id: 'rad_'+m.id+'_d', type: '💻 Digital', title: `💻 ${m.title}`, searchTitle: m.title, tmdbId: m.tmdbId, mediaType: 'movie', posterPath: poster, date: new Date(m.digitalRelease), color: '#3b82f6' }); }
                            if (m.physicalRelease) { newEvents.push({ id: 'rad_'+m.id+'_p', type: '💿 Physical', title: `💿 ${m.title}`, searchTitle: m.title, tmdbId: m.tmdbId, mediaType: 'movie', posterPath: poster, date: new Date(m.physicalRelease), color: '#8b5cf6' }); }
                        });
                    }
                } catch(e) {}
            }
            if (sUrl && sKey) {
                try {
                    let res = await fetch(`${sUrl.trim().replace(/\/$/, "")}/api/v3/calendar?apiKey=${sKey.trim()}&start=${startStr}&end=${endStr}&unmonitored=false`);
                    let eps = await res.json();
                    if (Array.isArray(eps)) {
                        let sonarrGroups = {};
                        eps.forEach(e => {
                            let dt = new Date(e.airDateUtc || e.airDate); let dateStr = `${dt.getFullYear()}-${dt.getMonth()}-${dt.getDate()}`;
                            let sId = e.seriesId || 0; let key = `${dateStr}_${sId}`;
                            if (!sonarrGroups[key]) {
                                let sObj = seriesMap[sId] || e.series;
                                sonarrGroups[key] = {
                                    id: 'son_'+sId+'_'+dateStr, date: dt, seriesTitle: sObj ? (sObj.title || 'Unknown Series') : 'Unknown Series',
                                    searchTitle: sObj ? (sObj.title || 'Unknown Series') : 'Unknown Series', tmdbId: sObj ? sObj.tmdbId : null, tvdbId: sObj ? sObj.tvdbId : null,
                                    posterPath: sObj?.images?.find(i => i.coverType === 'poster')?.remoteUrl || '', episodes: []
                                };
                            }
                            sonarrGroups[key].episodes.push(e);
                        });
                        Object.values(sonarrGroups).forEach(group => {
                            let epText = group.episodes.length === 1 ? `S${String(group.episodes[0].seasonNumber).padStart(2,'0')}E${String(group.episodes[0].episodeNumber).padStart(2,'0')}` : `${group.episodes.length} Eps`;
                            newEvents.push({ id: group.id, type: 'TV', title: `📺 ${group.seriesTitle} ${epText}`, searchTitle: group.seriesTitle, tmdbId: group.tmdbId, tvdbId: group.tvdbId, mediaType: 'tv', posterPath: group.posterPath, date: group.date, color: '#10b981' });
                        });
                    }
                } catch(e) {}
            }
            calendarEvents = newEvents;
            if (currentTab === 'smarthome' && !modalOpen) render();
        }

                } else if (currentMediaMode === 'foryou') {

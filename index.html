        function renderCalendarHTML() {
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            let firstDay = new Date(displayYear, displayMonth, 1).getDay();
            let daysInMonth = new Date(displayYear, displayMonth + 1, 0).getDate();

            let html = `
            <div class="calendar-nav">
                <button onclick="changeMonth(-1)" class="calendar-nav-btn">&lt;</button>
                <h4 class="calendar-nav-title">${monthNames[displayMonth]} ${displayYear}</h4>
                <button onclick="changeMonth(1)" class="calendar-nav-btn">&gt;</button>
            </div>
            <div class="calendar-grid">`;
            
            ['S','M','T','W','T','F','S'].forEach(day => {
                html += `<div class="calendar-header-day">${day}</div>`;
            });

            let prevMonthDays = new Date(displayYear, displayMonth, 0).getDate();
            for (let i = 0; i < firstDay; i++) {
                let d = prevMonthDays - firstDay + i + 1;
                html += `<div class="calendar-cell inactive-cell"><div class="calendar-date">${d}</div></div>`;
            }

            let today = new Date();
            for (let i = 1; i <= daysInMonth; i++) {
                let isToday = today.getDate() === i && today.getMonth() === displayMonth && today.getFullYear() === displayYear;
                let dateStr = `${displayYear}-${String(displayMonth+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;

                let dayEventsHTML = '';
                calendarEvents.forEach(ev => {
                    let isMatch = false;
                    let evDateStr = ev.date ? `${ev.date.getFullYear()}-${String(ev.date.getMonth()+1).padStart(2,'0')}-${String(ev.date.getDate()).padStart(2,'0')}` : null;

                    if (ev.start && ev.end) {
                        let dCheck = new Date(displayYear, displayMonth, i);
                        let s = new Date(ev.start + 'T00:00:00');
                        let e = new Date(ev.end + 'T23:59:59');
                        if (dCheck >= s && dCheck <= e) isMatch = true;
                    } else if (evDateStr === dateStr) {
                        isMatch = true;
                    }

                    if (isMatch) {
                        dayEventsHTML += `<div class="calendar-event" style="background:${ev.color}; color:${ev.textColor || '#ffffff'};">${ev.title}</div>`;
                    }
                });

                html += `
                <div class="calendar-cell ${isToday ? 'today-cell' : ''}">
                    <div class="calendar-date">${i}</div>
                    ${dayEventsHTML}
                </div>`;
            }

            let totalCells = firstDay + daysInMonth;
            let remaining = (7 - (totalCells % 7)) % 7;
            for (let i = 1; i <= remaining; i++) {
                html += `<div class="calendar-cell inactive-cell"><div class="calendar-date">${i}</div></div>`;
            }

            html += `</div>`;
            return html;
        }

                try {
                    let res = await fetch(`${rUrl.trim().replace(/\/$/, "")}/api/v3/calendar?apiKey=${rKey.trim()}&start=${startStr}&end=${endStr}&unmonitored=false`);
                    let movies = await res.json();

                            if (m.digitalRelease) { newEvents.push({ type: '💻 Digital', title: `💻 ${m.title}`, date: new Date(m.digitalRelease), color: '#3b82f6' }); }
                            if (m.physicalRelease) { newEvents.push({ type: '💿 Physical', title: `💿 ${m.title}`, date: new Date(m.physicalRelease), color: '#8b5cf6' }); }
                        });
                    }
                } catch(e) {}

                    let eps = await res.json();

                            let dt = new Date(e.airDateUtc || e.airDate);
                            let dateStr = `${dt.getFullYear()}-${dt.getMonth()}-${dt.getDate()}`;
                            let sId = e.seriesId || 0;
                            let key = `${dateStr}_${sId}`;
                            
                            if (!sonarrGroups[key]) {
                                let fallbackName = (e.series && e.series.title) ? e.series.title : 'Unknown Series';
                                sonarrGroups[key] = {
                                    date: dt,
                                    seriesTitle: seriesMap[sId] || fallbackName,
                                    episodes: []
                                };
                            }
                            sonarrGroups[key].episodes.push(e);
                        });

                        Object.values(sonarrGroups).forEach(group => {
                            group.episodes.sort((a,b) => (a.seasonNumber - b.seasonNumber) || (a.episodeNumber - b.episodeNumber));

                            } else {

                        });
                    }
                } catch(e) {}
            }

            calendarEvents = newEvents;
            if (currentTab === 'smarthome' && !modalOpen) render();
        }

                if(data && data.length > 0) {
                    let main = data.reduce((prev, current) => (prev.totalSpace > current.totalSpace) ? prev : current);
                    let freeGB = (main.freeSpace / 1073741824).toFixed(1);
                    let totalGB = (main.totalSpace / 1073741824).toFixed(1);
                    let pct = Math.round(((main.totalSpace - main.freeSpace) / main.totalSpace) * 100);
                    serverDiskSpace = `💾 Storage: ${freeGB} GB Free / ${totalGB} GB (${pct}% Used)`;
                    if (currentTab === 'downloads') render(); 
                }
            } catch(e){}
        }

        async function syncQBittorrentList() {
            let u = localStorage.getItem('radarr_url'); if (!u) return;
            try {
                let baseUrl = u.trim().replace(/\/$/, "");
                let res = await fetch(`${baseUrl}/api/v2/torrents/info`);
                let list = await res.json();
                
                if (Array.isArray(list)) {
                    activeTorrents = list.map(t => {
                        let stateStr = String(t.state || '').toLowerCase();
                        let triggerState = "Downloading";
                        if (stateStr.includes('pause') || stateStr.includes('stop')) triggerState = "Stopped";
                        else if (stateStr.includes('up') || stateStr.includes('complete')) triggerState = "Seeding";
                        else if (stateStr.includes('check') || stateStr.includes('alloc')) triggerState = "Checking";
                        else if (stateStr.includes('error') || stateStr.includes('missing')) triggerState = "Error";

                        let progressPct = (t.progress * 100).toFixed(1);
                        let sizeGB = (t.size / 1073741824).toFixed(2);
                        let speedMB = (t.dlspeed / 1048576).toFixed(1);
                        
                        let etaStr = "Finished";
                        if (triggerState === "Downloading") {
                            if (t.eta < 8640000 && t.eta > 0) { 
                                let mins = Math.round(t.eta / 60);
                                etaStr = mins > 60 ? Math.floor(mins/60) + "h " + (mins%60) + "m" : mins + "m left";
                            } else { etaStr = "Stalled"; }
                        } else if (triggerState === "Stopped") { etaStr = "Paused"; }

                        return {
                            downloadId: t.hash, name: t.name, progress: progressPct, size: sizeGB,
                            speedLabel: speedMB > 0.0 ? `${speedMB} MB/s` : '', speed: triggerState, status: etaStr, rawStatus: stateStr
                        };
                    });
                }
                if (currentTab === 'downloads' || currentTab === 'collection') render();
            } catch(e) {}
        }

        async function executeToggleQueueTask(downloadHash, currentStatusStr) {
            let u = localStorage.getItem('radarr_url'); 
            if (!u || !downloadHash) return showAppNotification("Missing Configuration!");
            let isPaused = currentStatusStr.toLowerCase().includes('stop') || currentStatusStr.toLowerCase().includes('paused');
            let actionV5 = isPaused ? 'start' : 'stop';
            let actionV4 = isPaused ? 'resume' : 'pause';
            let label = isPaused ? 'Started' : 'Stopped';
            try {
                let safeHash = String(downloadHash).split('_').pop().toLowerCase();
                let headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
                let body = 'hashes=' + safeHash;
                let baseUrl = u.trim().replace(/\/$/, "");

                let res = await fetch(`${baseUrl}/api/v2/torrents/${actionV5}`, { method: 'POST', headers, body });
                if (res.status === 404) res = await fetch(`${baseUrl}/api/v2/torrents/${actionV4}`, { method: 'POST', headers, body });
                
                if (res.status === 200 || res.status === 201) {
                    showAppNotification(`Transfer ${label}`); setTimeout(syncQBittorrentList, 800);
                } else { showAppNotification("qBittorrent rejected: Error " + res.status); }
            } catch (e) { showAppNotification("Connection Error"); }
        }

            if (!wipeConfirmed) return;

            let searchForNew = confirm("Would you like Radarr to search for a different version automatically?\n\n[OK] = Find another version\n[Cancel] = Just remove and stop");

            try {
                let safeHash = String(downloadHash).split('_').pop().toLowerCase();
                let baseUrl = u.trim().replace(/\/$/, "");

                if (k) {
                    try {
                        let qRes = await fetch(`${baseUrl}/api/v3/queue?apiKey=${k.trim()}&includeUnknownStatusItems=true`);
                        let qData = await qRes.json();
                        let records = Array.isArray(qData) ? qData : (qData.records || []);
                        let match = records.find(r => r.downloadId && r.downloadId.toLowerCase().includes(safeHash));
                        
                        if (match && match.id) {
                            let blocklistParam = searchForNew ? 'true' : 'false';
                            await fetch(`${baseUrl}/api/v3/queue/${match.id}?apiKey=${k.trim()}&removeFromClient=true&blocklist=${blocklistParam}`, { method: 'DELETE' });
                            if (searchForNew && match.movieId) {
                                await fetch(`${baseUrl}/api/v3/command?apiKey=${k.trim()}`, {
                                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ name: "MoviesSearch", movieIds: [match.movieId] })
                                });
                            }
                        }
                    } catch(e) {}
                }
                let headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
                let body = `hashes=${safeHash}&deleteFiles=true`;
                await fetch(`${baseUrl}/api/v2/torrents/delete`, { method: 'POST', headers, body });

                showAppNotification(searchForNew ? "Deleted & Searching..." : "Deleted & Stopped");
                setTimeout(syncQBittorrentList, 800);
            } catch (e) { showAppNotification("Connection Error"); }
        }

        function launchModalFromAttributes(poolType, identifier, trackName = null) {
            try {
                let targetObject = null; let cleanId = String(identifier).toLowerCase().trim();
                
                if (poolType === 'search') targetObject = searchResultsData.find(m => String(m.tmdbId) === cleanId || m.title.toLowerCase().trim() === cleanId);
                else if (poolType === 'friend') targetObject = friendRowData.find(m => String(m.id) === cleanId || String(m.tmdbId) === cleanId || m.title.toLowerCase().trim() === cleanId);
                else if (poolType === 'discover') targetObject = (tracks[trackName] || []).find(m => String(m.tmdbId) === cleanId || m.title.toLowerCase().trim() === cleanId);
                else if (poolType === 'collection_part') { 
                    Object.values(myCollectionsCache).forEach(coll => {
                        let match = coll.parts.find(m => String(m.tmdbId) === cleanId);
                        if(match) targetObject = match;
                    });
                }
                else if (poolType === 'library') targetObject = myCollection.find(m => String(m.id) === cleanId || String(m.tmdbId) === cleanId || m.title.toLowerCase().trim() === cleanId);
                else if (poolType === 'watched_track') targetObject = customWatchedHistory.find(m => String(m.id) === cleanId || String(m.tmdbId) === cleanId || m.title.toLowerCase().trim() === cleanId);
                
                if (!targetObject) { activeItem = { title: identifier, overview: "Fetching metadata...", posterPath: '', cast: null }; } 
                else { activeItem = JSON.parse(JSON.stringify(targetObject)); activeItem.trailerKey = null; activeItem.cast = null; }
                
                activeItem.jfChecked = false; 
                modalOpen = true; render();
                
                let tk = localStorage.getItem('tmdb_key');
                if (tk && activeItem && activeItem.tmdbId) {
                    fetch(`https://api.themoviedb.org/3/movie/${activeItem.tmdbId}?api_key=${tk.trim()}&append_to_response=videos,credits`)
                    .then(res => res.json())
                    .then(d => {
                        if (d && modalOpen && activeItem.tmdbId === d.id) { 
                            activeItem.overview = d.overview || "No summary available.";
                            activeItem.backdrop_path = d.backdrop_path ? `https://image.themoviedb.org/t/p/w780${d.backdrop_path}` : '';
                            if (d.release_date) {
                                activeItem.realYear = d.release_date.substring(0, 4);
                                activeItem.year = d.release_date.substring(0, 4);
                            }
                            if (d.belongs_to_collection) activeItem.collection = d.belongs_to_collection;
                            
                            let trailerObj = d.videos && d.videos.results ? d.videos.results.find(v => v.type === 'Trailer' && v.site === 'YouTube') : null;
                            if (trailerObj) activeItem.trailerKey = trailerObj.key;

                            if (d.credits && d.credits.cast) {
                                activeItem.cast = d.credits.cast.slice(0, 10).map(c => ({ id: c.id, name: c.name }));
                            }
                            
                            if (localStorage.getItem('jf_url') && localStorage.getItem('jf_key')) {

                                if (!jfUrl.startsWith('http')) jfUrl = 'http://' + jfUrl;
                                let jfKey = localStorage.getItem('jf_key').trim();
                                fetch(`${jfUrl}/Items?IncludeItemTypes=Movie&Recursive=true&searchTerm=${encodeURIComponent(activeItem.title)}&api_key=${jfKey}`)
                                .then(r => {
                                    if(!r.ok) throw new Error(r.status);
                                    return r.json();
                                })
                                .then(d => {
                                    activeItem.jfChecked = true;
                                    let match = d.Items && d.Items.find(i => i.ProviderIds && String(i.ProviderIds.Tmdb) === String(activeItem.tmdbId));
                                    if (!match && d.Items && d.Items.length > 0) match = d.Items[0]; 
                                    if (match) {
                                        activeItem.jellyfinId = match.Id;
                                        return fetch(`${jfUrl}/Sessions?api_key=${jfKey}`);
                                    } else {
                                        render();
                                    }
                                })
                                .then(r => {
                                    if (r && !r.ok) throw new Error(r.status);
                                    return r ? r.json() : null;
                                })
                                .then(sessions => {
                                    if (sessions && modalOpen) {
                                        activeItem.jfSessions = sessions.filter(s => {
                                            let client = (s.Client || '').toLowerCase();
                                            let device = (s.DeviceName || '').toLowerCase();
                                            return !client.includes('server') && !client.includes('web') && !device.includes('server');
                                        });
                                        render();
                                    }
                                }).catch(e => {
                                    console.error("Jellyfin Error", e);
                                    activeItem.jfChecked = true;
                                    activeItem.jfError = e.message === "Failed to fetch" ? "Network / CORS" : e.message;
                                    render();
                                });
                            } else {
                                render(); 
                            }
                        }
                    })
                    .catch(() => { if (modalOpen) { activeItem.overview = "Unable to load summary."; render(); }});
                }
            } catch (e) { console.error("Modal Launch Error:", e); }
        }

                let cleanYearStr = "2026";
                let match = String(activeItem.year || activeItem.realYear || "").match(/\d{4}/);

                let customEntry = { 
                    id: 'cust_' + Date.now(),

                    realYear: cleanYearStr, 
                    overview: activeItem.overview || '',

        async function loadDiscoverTracks() {
            let tk = localStorage.getItem('tmdb_key'); if (!tk) return;
            tracks = { "Action": [], "Comedy": [], "Drama": [], "Adventure": [], "Mystery": [], "Sci-Fi": [], "1960s": [], "1970s": [], "1980s": [], "1990s": [], "2000s": [] };
            let genres = { "Action": "28", "Comedy": "35", "Drama": "18", "Adventure": "12", "Mystery": "9648", "Sci-Fi": "878" };
            let decades = [["1960s", [1960, 1969]], ["1970s", [1970, 1979]], ["1980s", [1980, 1989]], ["1990s", [1990, 1999]], ["2000s", [2000, 2009]]];
            let randomPage = Math.floor(Math.random() * 5) + 1;
            try {
                for (let [title, gId] of Object.entries(genres)) {
                    let res1 = await (await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${tk.trim()}&with_genres=${gId}&sort_by=popularity.desc&with_original_language=en&page=${randomPage}`)).json();
                    tracks[title] = (res1.results || []).slice(0, 20).map(m => ({ title: m.title, year: m.release_date ? m.release_date.substring(0,4) : '', realYear: m.release_date ? m.release_date.substring(0,4) : '', rating: m.vote_average ? m.vote_average.toFixed(1) : '7.0', tmdbId: m.id, posterPath: "https://image.tmdb.org/t/p/w200" + m.poster_path, overview: m.overview || '' }));
                }
                for (let [title, range] of decades) {
                    let res1 = await (await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${tk.trim()}&primary_release_date.gte=${range[0]}-01-01&primary_release_date.lte=${range[1]}-12-31&sort_by=vote_average.desc&vote_count.gte=500&with_original_language=en&page=${randomPage}`)).json();
                    tracks[title] = (res1.results || []).slice(0, 20).map(m => ({ title: m.title, year: m.release_date ? m.release_date.substring(0,4) : '', realYear: m.release_date ? m.release_date.substring(0,4) : '', rating: m.vote_average ? m.vote_average.toFixed(1) : '7.0', tmdbId: m.id, posterPath: "https://image.tmdb.org/t/p/w200" + m.poster_path, overview: m.overview || '' }));
                }
                render();
            } catch(e) {}
        }

        async function syncFeeds() {       
            let links = localStorage.getItem('lb_links'), tk = localStorage.getItem('tmdb_key'); if (!links) return;
            let arr = links.split(','), blended = [];
            
            for (let l of arr) {
                let user = l.trim().replace(/\/$/, ""); if (!user) continue;
                if (user.includes('letterboxd.com/')) user = user.split('letterboxd.com/')[1];
                user = user.replace(/^\//, "").trim().toLowerCase(); if (!user) continue;
                
                try {
                    let targetUrl = "https://letterboxd.com/" + user + "/rss/";
                    let res = await fetch("https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(targetUrl));
                    let data = await res.json();
                    
                    if (data.status !== 'ok' || !data.items) {
                        console.error("Failed to load feed for: " + user);
                        continue;
                    }
                    
                    for (let i = 0; i < Math.min(data.items.length, 25); i++) {
                        let t = (data.items[i].title || '').split(' - ')[0];
                        if (t && !blended.some(m => m.title === t)) {
                            let cleanTitleStr = t.replace(/,\s*\d{4}$/, "").trim();
                            let itemObj = { id: 'lb_'+user+'_'+i, title: cleanTitleStr, year: '', realYear: '', rating: 'Pick', tmdbId: 238, posterPath: '', overview: '', friend: '@' + user };
                            blended.push(itemObj);
                            
                            if (tk) {
                                let cleanQuery = cleanTitleStr.match(/^(.+?),\s*(\d{4})$/) ? cleanTitleStr.match(/^(.+?),\s*(\d{4})$/)[1].trim() : cleanTitleStr;
                                fetch(`https://api.themoviedb.org/3/search/movie?api_key=${tk.trim()}&query=${encodeURIComponent(cleanQuery)}`)
                                    .then(r => r.json()).then(s => { 
                                        if (s.results?.[0]) { 
                                            itemObj.tmdbId = s.results[0].id; 
                                            itemObj.posterPath = "https://image.tmdb.org/t/p/w200" + s.results[0].poster_path; 
                                            itemObj.overview = s.results[0].overview || ''; 
                                            if (s.results[0].release_date) {
                                                let y = String(s.results[0].release_date.substring(0,4));
                                                itemObj.realYear = y;
                                                itemObj.year = y;
                                            }
                                            render(); 
                                        } 
                                    }).catch(()=>{});
                            }
                        }
                    }
                } catch(e) {
                    console.error("Error parsing feed for: " + user, e);
                }
            }
            
            for (let i = blended.length - 1; i > 0; i--) { 
                let j = Math.floor(Math.random() * (i + 1)), temp = blended[i]; 
                blended[i] = blended[j]; 
                blended[j] = temp; 
            }
            friendRowData = blended; 
            render();
        }

        function render() {
            let out = document.getElementById('view-root'), body = '', modal = '';
            let existingSearchVal = document.getElementById('search-input') ? document.getElementById('search-input').value : '';
            let clearBtnStyle = existingSearchVal.trim().length > 0 ? 'block' : 'none';
            
            if (currentTab === 'collection') {
                let watchedMovies = [...customWatchedHistory];
                if (watchedSortMode === 'alpha') {
                    watchedMovies.sort((a, b) => a.title.localeCompare(b.title));
                } else if (watchedSortMode === 'year_desc') {
                    watchedMovies.sort((a, b) => parseNumericYear(b) - parseNumericYear(a));
                } else if (watchedSortMode === 'year_asc') {

                if (localStorage.getItem('jf_url') && localStorage.getItem('jf_key')) {
                    if (activeItem.jfError) {
                        jellyfinHtml = `<div style="background:#fee2e2; color:#ef4444; padding:12px; border-radius:12px; font-size:11px; font-weight:800; text-transform:uppercase; text-align:center; border:1px dashed #f87171; letter-spacing:0.5px; width:100%; box-sizing:border-box;">❌ JF Error: ${activeItem.jfError}</div>`;
                    } else if (activeItem.jfChecked === false) {
                        jellyfinHtml = `<div style="background:#f8fafc; color:#94a3b8; padding:12px; border-radius:12px; font-size:11px; font-weight:800; text-transform:uppercase; text-align:center; border:1px dashed #cbd5e1; letter-spacing:0.5px; width:100%; box-sizing:border-box;">⏳ Searching Jellyfin...</div>`;
                    } else if (!activeItem.jellyfinId) {
                        jellyfinHtml = `<div style="background:#f8fafc; color:#94a3b8; padding:12px; border-radius:12px; font-size:11px; font-weight:800; text-transform:uppercase; text-align:center; border:1px dashed #cbd5e1; letter-spacing:0.5px; width:100%; box-sizing:border-box;">📁 Not Found In Jellyfin</div>`;
                    } else if (activeItem.jfSessions && activeItem.jfSessions.length > 0) {
                        if (activeItem.jfSessions.length === 1) {
                            let s = activeItem.jfSessions[0];
                            jellyfinHtml = `<button onclick="castToJellyfin('${s.Id}')" style="width:100%; background:linear-gradient(90deg, #8b5cf6 0%, #6366f1 100%); color:#ffffff; border:none; padding:15px; border-radius:12px; font-weight:800; text-transform:uppercase; font-size:12px; cursor:pointer; box-shadow: 0 4px 12px rgba(139,92,246,0.25); box-sizing:border-box;">📺 Play on ${s.DeviceName || s.Client}</button>`;
                        } else {
                            let options = activeItem.jfSessions.map(s => `<option value="${s.Id}">${s.DeviceName || s.Client}</option>`).join('');
                            jellyfinHtml = `<div style="display:flex; gap:10px; width:100%; box-sizing:border-box;"><select id="jf_session_select" style="flex:1; padding:15px; border-radius:12px; border:1px solid #cbd5e1; outline:none; font-weight:700; color:#0f172a; background:#f8fafc; font-size:12px;">${options}</select><button onclick="castToJellyfin(document.getElementById('jf_session_select').value)" style="background:linear-gradient(90deg, #8b5cf6 0%, #6366f1 100%); color:#ffffff; border:none; padding:0 24px; border-radius:12px; font-weight:800; text-transform:uppercase; font-size:12px; cursor:pointer; box-shadow: 0 4px 12px rgba(139,92,246,0.25);">📺 Cast</button></div>`;
                        }
                    } else {
                        jellyfinHtml = `<button onclick="wakeTvAndLaunchJellyfin()" style="width:100%; background:linear-gradient(90deg, #f97316 0%, #ea580c 100%); color:#ffffff; border:none; padding:15px; border-radius:12px; font-weight:800; text-transform:uppercase; font-size:12px; cursor:pointer; box-shadow: 0 4px 12px rgba(234,88,12,0.25); box-sizing:border-box;">📺 Wake TV & Open Jellyfin</button>`;
                    }
                }

                modal = `<div class="modal-overlay">
                    <div class="modal-bg" ${activeItem.posterPath ? `style="background-image:url('${activeItem.posterPath}');"` : ''}></div>
                    <div class="modal-bg-tint"></div>
                    <div class="detail-close-trigger" onclick="closeM()">×</div>
                    ${topUnwatchBadge}
                    <div class="detail-content-frame">
                        <div class="detail-main-row">
                            <div class="detail-poster-wrapper"><img class="detail-poster-img" src="${activeItem.posterPath || ''}"></div>
                            <div class="detail-meta-block">
                                <h3 class="detail-heading-title">${activeItem.title}</h3>
                                <p class="detail-sub-specs">${displaySpecsYear}</p>
                            </div>
                        </div>
                        ${extraBtns}
                        <div id="modal-trailer-frame-box" class="trailer-video-box"></div>
                        ${castHtml}
                        <div class="detail-synopsis-box">
                            <h4>Summary</h4>
                            <div class="synopsis-text">${activeItem.overview || 'No overview available.'}</div>
                        </div>
                        <div class="detail-footer-actions">
                            ${jellyfinHtml}
                            <div style="display:flex; gap:12px; width:100%;">
                                ${watchButtonHtml}
                                ${radarrButtonHtml}
                            </div>
                        </div>
                    </div>
                </div>`;
            } else if (activeCollection) {
                modal = `<div class="modal-overlay">
                    <div class="detail-close-trigger" onclick="closeM()">×</div>
                    <div class="detail-content-frame" style="margin-top:0; padding-top:80px; overflow-y:auto; display:block;">
                        <h3 class="detail-heading-title" style="margin-bottom:16px;">${activeCollection.name}</h3>
                        <div class="movie-grid">${activeCollection.parts.map(m => `
                            <div class="movie-card movie-trigger" data-pool="collection_part" data-id="${m.tmdbId}">
                                <div class="poster-slot"><img src="${m.posterPath}" class="grid-poster-img"></div>
                                <div class="grid-card-details">${m.title}</div>
                            </div>`).join('')}
                        </div>
                    </div>
                </div>`;
            }
            
            let searchContainerHtml = currentTab === 'foryou' ? `
                <div class="search-container-box">
                    <input type="text" id="search-input" class="search-input-field" placeholder="Search any movie..." onkeyup="if(event.key === 'Enter') triggerUniversalSearch(this.value)" value="${existingSearchVal}">
                    <button id="search-clear-trigger" onclick="clearSearchInput()" class="clear-search-btn" style="display: ${clearBtnStyle};">✕</button>
                </div>
            ` : '';

            let headerHtml = searchContainerHtml !== '' ? `
                <div class="header" style="border-bottom: none; padding-bottom: 0; margin-bottom: 5px;">
                    <div class="search-wrapper">
                        ${searchContainerHtml}
                    </div>
                </div>
            ` : '';

            out.innerHTML = `
            ${headerHtml}
            ${searchResultsHtml}${body}${modal}
            `;
        }

        document.addEventListener('click', function (e) {
            let triggerCard = e.target.closest('.movie-trigger');
            if (triggerCard) {
                e.preventDefault();
                let pool = triggerCard.getAttribute('data-pool');
                if (pool === 'person') {
                    fetchPersonCredits(triggerCard.getAttribute('data-id'), triggerCard.getAttribute('data-name'));
                } else {
                    launchModalFromAttributes(
                        pool, 
                        triggerCard.getAttribute('data-id'), 
                        triggerCard.getAttribute('data-track')
                    );
                }
            } else if (openMenuHash) {
                openMenuHash = null;
                render();
            }
        });

        function exportWatchedList() {
            const backupPayload = {
                watched: JSON.parse(localStorage.getItem('custom_watched_history') || '[]'),
                cache: JSON.parse(localStorage.getItem('local_watched_cache') || '[]'),
                collections: JSON.parse(localStorage.getItem('my_collections_cache') || '{}')
            };
            document.getElementById('migrationBox').value = JSON.stringify(backupPayload);
            document.getElementById('migrationBox').select();
            alert('All data exported! Copy the text inside the box now.');
        }

        function importWatchedList() {
            const dataToImport = document.getElementById('migrationBox').value.trim();
            if (!dataToImport) return alert('Please paste data into the box first.');
            try {
                let parsed = JSON.parse(dataToImport); 
                if (Array.isArray(parsed)) {
                    localStorage.setItem('custom_watched_history', dataToImport);
                    let cacheArr = parsed.map(m => String(m.title).toLowerCase().trim());
                    parsed.forEach(m => { if(m.tmdbId) cacheArr.push(String(m.tmdbId)); });
                    localStorage.setItem('local_watched_cache', JSON.stringify(cacheArr));
                } else {
                    if (parsed.watched) localStorage.setItem('custom_watched_history', JSON.stringify(parsed.watched));
                    if (parsed.cache) localStorage.setItem('local_watched_cache', JSON.stringify(parsed.cache));
                    if (parsed.collections) localStorage.setItem('my_collections_cache', JSON.stringify(parsed.collections));
                }
                alert('Success! Data imported. Refreshing...');
                location.reload();
            } catch (e) { alert('Invalid format.'); }
        }

        if(localStorage.getItem('radarr_url')&&localStorage.getItem('radarr_key')) {
            syncRadarrLibrary();
            fetchDiskSpace();
            fetchMediaCalendars();
        }
        if(localStorage.getItem('ha_key')) {
            fetchHAEntities();
        }
        syncFeeds(); loadDiscoverTracks(); render();

        let tickCount = 0;
        setInterval(() => {
            syncQBittorrentList();
            if (currentTab === 'smarthome') syncJfSessions();
            tickCount++;
            if (tickCount % 5 === 0) fetchDiskSpace();
            if (tickCount % 20 === 0) fetchMediaCalendars();
        }, 3000);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Movie Tracker Dashboard</title>
    <style>
        html, body { background: #f1f5f9; color: #0f172a; font-family: -apple-system, sans-serif; margin: 0; padding: 12px 8px 125px 8px; box-sizing: border-box; }
        .header { display: flex; width: 100%; border-bottom: 1px solid #e2e8f0; padding-bottom: 14px; margin-bottom: 20px; }
        .search-input-field { width: 100%; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 14px; padding: 14px 16px; outline: none; }
        .stats-grid { display: flex; gap: 10px; margin-bottom: 24px; }
        .stat-card { flex: 1; background: #ffffff; border: 1px solid #cbd5e1; padding: 14px 4px; border-radius: 16px; text-align: center; cursor: pointer; }
        .stat-card.active-sub-tab { border-color: #f97316; background: #fff7ed; }
        .stat-num { font-size: 22px; font-weight: 800; }
        .stat-lbl { font-size: 10px; color: #64748b; text-transform: uppercase; margin-top: 4px; }
        .movie-grid { display: flex; flex-wrap: wrap; gap: 12px; }
        .movie-card { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 16px; overflow: hidden; width: calc(50% - 6px); box-shadow: 0 4px 10px rgba(0,0,0,0.04); position: relative; cursor: pointer; }
        .poster-slot { width: 100%; height: 230px; background: #e2e8f0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .grid-poster-img { width: 100%; height: 100%; object-fit: cover; }
        .card-details { padding: 12px; font-size: 13px; font-weight: 700; border-top: 1px solid #e2e8f0; }
        .row-container { margin-bottom: 26px; width: 100%; }
        .row-title { font-size: 14px; font-weight: 800; color: #334155; text-transform: uppercase; margin-bottom: 12px; padding-left: 4px; }
        .scroll-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; width: 100%; }
        .scroll-card { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 16px; width: 145px; min-width: 145px; cursor: pointer; }
        .scroll-poster { width: 100%; height: 215px; background: #e2e8f0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .scroll-poster-img { width: 100%; height: 100%; object-fit: cover; }
        .nav-footer { position: fixed; bottom: 0; left: 0; right: 0; height: 86px; background: rgba(255, 255, 255, 0.95); border-top: 1px solid #cbd5e1; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); backdrop-filter: blur(10px); }
        .nav-btn { background: none; border: none; color: #64748b; font-weight: 800; font-size: 11px; text-transform: uppercase; cursor: pointer; }
        .nav-btn.active { color: #f97316; }
    </style>
</head>
<body>
    <div id="view-root"></div>
    <script>
        let currentTab = localStorage.getItem('app_current_tab') || 'collection';
        let currentSubTab = localStorage.getItem('app_current_sub_tab') || 'downloaded';
        let myCollection = JSON.parse(localStorage.getItem('local_collection')) || [];
        let tracks = { "Action": [], "Drama": [], "Adventure": [], "Mystery": [] };
        let friendRowData = [], modalOpen = false, activeItem = null;

        function render() {
            let root = document.getElementById('view-root');
            let content = '';
            if (currentTab === 'collection') {
                let w = myCollection.filter(m => m.played), d = myCollection.filter(m => m.hasFile), c = myCollection.filter(m => !m.hasFile && !m.played);
                let list = (currentSubTab === 'watched') ? w : (currentSubTab === 'downloaded') ? d : c;
                content = `
                <div class="stats-grid">
                    <div class="stat-card ${currentSubTab==='watched'?'active-sub-tab':''}" onclick="switchSubTab('watched')"><div class="stat-num">${w.length}</div><div class="stat-lbl">Watched</div></div>
                    <div class="stat-card ${currentSubTab==='downloaded'?'active-sub-tab':''}" onclick="switchSubTab('downloaded')"><div class="stat-num">${d.length}</div><div class="stat-lbl">Downloaded</div></div>
                    <div class="stat-card ${currentSubTab==='comingsoon'?'active-sub-tab':''}" onclick="switchSubTab('comingsoon')"><div class="stat-num">${c.length}</div><div class="stat-lbl">Coming Soon</div></div>
                </div>
                <div class="movie-grid">${list.map(m => `
                    <div class="movie-card movie-trigger" data-pool="library" data-id="${m.tmdbId || m.id}">
                        <div class="poster-slot">${m.posterPath ? `<img class="grid-poster-img" src="${m.posterPath}">` : 'No Image'}</div>
                        <div class="card-details">${m.title}</div>
                    </div>`).join('')}</div>`;
            } else if (currentTab === 'foryou') {
                content = `<div class="row-title">🔥 FRIENDS</div><div class="scroll-row">${friendRowData.map(m => `
                    <div class="scroll-card movie-trigger" data-pool="friend" data-id="${m.title}">
                        <div class="scroll-poster"><img class="scroll-poster-img" src="${m.posterPath}"></div>
                        <div class="card-details">${m.title}</div>
                    </div>`).join('')}</div>` + Object.keys(tracks).map(cat => `
                    <div class="row-container"><div class="row-title">🎬 ${cat.toUpperCase()}</div><div class="scroll-row">${tracks[cat].map(m => `
                        <div class="scroll-card movie-trigger" data-pool="discover" data-id="${m.tmdbId}">
                            <div class="scroll-poster"><img class="scroll-poster-img" src="${m.posterPath}"></div>
                            <div class="card-details">${m.title}</div>
                        </div>`).join('')}</div></div>`).join('');
            }
            root.innerHTML = `<div class="header"><input class="search-input-field" placeholder="Search..."></div>${content}
                <div class="nav-footer">
                    <button class="nav-btn ${currentTab==='collection'?'active':''}" onclick="switchTab('collection')">Movies</button>
                    <button class="nav-btn ${currentTab==='foryou'?'active':''}" onclick="switchTab('foryou')">For You</button>
                </div>`;
        }

        async function syncRadarrLibrary() {
            let u = localStorage.getItem('radarr_url'), k = localStorage.getItem('radarr_key'); if (!u || !k) return;
            let items = await (await fetch(`${u}/api/v3/movie?apiKey=${k}`)).json();
            let custom = JSON.parse(localStorage.getItem('custom_watched_history')) || [];
            let masterLibrary = new Map();
            custom.forEach(h => { if(h.tmdbId) masterLibrary.set(String(h.tmdbId), {...h, played: true, hasFile: false}); });
            items.forEach(i => {
                let tmdbId = String(i.tmdbId);
                let existing = masterLibrary.get(tmdbId);
                masterLibrary.set(tmdbId, { id: String(i.id), title: i.title, tmdbId: i.tmdbId, hasFile: i.hasFile, played: existing ? true : false, posterPath: i.images[0]?.remoteUrl || '' });
            });
            myCollection = Array.from(masterLibrary.values());
            localStorage.setItem('local_collection', JSON.stringify(myCollection));
            render();
        }

        function switchTab(t) { currentTab = t; localStorage.setItem('app_current_tab', t); render(); }
        function switchSubTab(t) { currentSubTab = t; localStorage.setItem('app_current_sub_tab', t); render(); }
        
        document.addEventListener('click', (e) => {
            let t = e.target.closest('.movie-trigger');
            if (t) { /* Logic to open modal if desired */ }
        });

        syncRadarrLibrary(); render();
    </script>
</body>
</html>

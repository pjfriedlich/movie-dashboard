<body>

    <div class="nav-footer">
        <button onclick="switchMode('movies')" class="nav-btn" id="nav-movies"><div class="nav-icon-wrapper"><svg class="nav-svg-icon" viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3zm5 15h-2v-6H9v6H7v-7.81l5-4.5 5 4.5V18z"/></svg></div>Movies</button>
        <button onclick="switchMode('shows')" class="nav-btn" id="nav-shows"><div class="nav-icon-wrapper"><svg class="nav-svg-icon" viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg></div>TV Shows</button>

        <button onclick="switchMode('settings')" class="nav-btn" id="nav-settings"><div class="nav-icon-wrapper"><svg class="nav-svg-icon" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.16.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.16-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38, 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></div>Settings</button>
    </div>
    <script>
        let letterboxdData = {}, friendRowData = [], activeTorrents = [], searchResultsData = [], calendarEvents = [];
        window.foreignMoviesData = [];
        let modalOpen = false, activeItem = null, activeCollection = null, activeFriendName = null;
        let currentMediaMode = localStorage.getItem('mode_tab') || 'movies';
        let currentSubTab = localStorage.getItem('sub_tab') || 'downloaded';
        let currentShowSubTab = localStorage.getItem('show_sub_tab') || 'downloaded';
        let currentForYouSubTab = localStorage.getItem('foryou_sub_tab') || 'movies';
        let watchedSortMode = localStorage.getItem('watched_sort_mode') || 'recent';
        let filtersExpanded = localStorage.getItem('filters_expanded') === 'true';

        let myCollection = JSON.parse(localStorage.getItem('local_collection')) || [];
        let myShows = JSON.parse(localStorage.getItem('local_shows')) || [];
        let customWatchedHistory = JSON.parse(localStorage.getItem('custom_watched_history')) || [];
        let localWatchedCache = JSON.parse(localStorage.getItem('local_watched_cache')) || [];
        let myCollectionsCache = JSON.parse(localStorage.getItem('my_collections_cache')) || {};
        let movieTracks = { "Action": [], "Comedy": [], "Drama": [], "Adventure": [], "Sci-Fi": [], "1960s": [], "1970s": [], "1980s": [], "1990s": [], "2000s": [], "2010s": [], "2020s": [] };
        let tvTracks = { "Action": [], "Comedy": [], "Drama": [], "1960s": [], "1970s": [], "1980s": [], "1990s": [], "2000s": [], "2010s": [], "2020s": [] };

        window.isItemMatch = function(a, b) {
            if(!a || !b) return false;
            if(a.tmdbId && b.tmdbId && String(a.tmdbId) === String(b.tmdbId)) return true;
            if(a.id && b.id && String(a.id) === String(b.id)) return true;
            if(a.title && b.title && String(a.title).toLowerCase().trim() === String(b.title).toLowerCase().trim()) return true;
            return false;
        };

        window.syncFeeds = function() {
            let lbLinks = localStorage.getItem('lb_links') || '';
            let configuredUsers = lbLinks.split(/[\n,\s\t]+/).map(u => u.trim().toLowerCase().replace('@', '')).filter(u => u);
            let newFriendData = [];
            
            if(letterboxdData) {
                let iterable = Array.isArray(letterboxdData) ? letterboxdData.map(i => [i.username || i.user, i]) : Object.entries(letterboxdData);
                iterable.forEach(([user, lists]) => {
                    if (!user) return;
                    let clean = String(user).trim().toLowerCase().replace('@', '');
                    if((configuredUsers.length === 0 || configuredUsers.includes(clean)) && lists && lists.highly_rated) {
                        lists.highly_rated.forEach(movie => {
                            if(!newFriendData.find(m => m.title.toLowerCase() === movie.title.toLowerCase())) {
                                newFriendData.push({ id: movie.title, title: movie.title, rating: movie.rating || '0.0', posterPath: movie.posterPath || (movie.poster_path ? 'https://image.tmdb.org/t/p/w500' + movie.poster_path : ''), mediaType: 'movie' });
                            }
                        });
                    }
                });
                
                friendRowData = newFriendData;
                
                let tk = localStorage.getItem('tmdb_key');
                if(tk) {
                    friendRowData.forEach((m, idx) => {
                        if (!m.tmdbId) {
                            fetch(`https://api.themoviedb.org/3/search/movie?api_key=${tk.trim()}&query=${encodeURIComponent(m.title)}`)
                            .then(r=>r.json()).then(d => {
                                if(d.results && d.results[0]) {
                                    friendRowData[idx].tmdbId = d.results[0].id;
                                    friendRowData[idx].posterPath = d.results[0].poster_path ? 'https://image.tmdb.org/t/p/w500'+d.results[0].poster_path : '';
                                    friendRowData[idx].overview = d.results[0].overview;
                                    friendRowData[idx].rating = d.results[0].vote_average ? d.results[0].vote_average.toFixed(1) : '0.0';
                                    if(currentMediaMode === 'foryou') render();
                                }
                            }).catch(()=>{});
                        }
                    });
                }
            }
        };

        function switchMode(m) { currentMediaMode = m; localStorage.setItem('mode_tab', m); searchResultsData = []; if(m==='downloads') syncDownloadQueue(); render(); }
        function switchSubTab(s) { currentSubTab = s; localStorage.setItem('sub_tab', s); render(); }
        function switchShowSubTab(s) { currentShowSubTab = s; localStorage.setItem('show_sub_tab', s); render(); }
        function switchForYouSubTab(s) { currentForYouSubTab = s; localStorage.setItem('foryou_sub_tab', s); render(); }
        function switchWatchedSort(s) { watchedSortMode = s; localStorage.setItem('watched_sort_mode', s); render(); }
        function closeM() { modalOpen = false; activeItem = null; activeCollection = null; activeFriendName = null; render(); }
        function showAppNotification(txt) { let b = document.getElementById('app-toast-banner'); if(!b) return; b.innerText = txt; b.classList.add('toast-show-active'); setTimeout(() => b.classList.remove('toast-show-active'), 3000); }
        function formatBytes(b) { if(!+b) return '0 B'; let k = 1024, sizes = ['B', 'KB', 'MB', 'GB', 'TB'], i = Math.floor(Math.log(b) / Math.log(k)); return `${parseFloat((b / Math.pow(k, i)).toFixed(2))} ${sizes[i]}`; }
        function parseNumericYear(i) { if(!i) return 0; let v = i.realYear || i.year; return v ? parseInt(String(v).replace(/\D/g, ""), 10) || 0 : 0; }
        window.syncDownloadQueue = async function() {
            let rUrl = localStorage.getItem('radarr_url'), rKey = localStorage.getItem('radarr_key');
            let sUrl = localStorage.getItem('sonarr_url'), sKey = localStorage.getItem('sonarr_key');
            try {
                let rP = (rUrl && rKey) ? fetch(`${rUrl.replace(/\/$/, "")}/api/v3/queue?apiKey=${rKey}`).then(r=>r.json()).catch(()=>[]) : Promise.resolve([]);
                let sP = (sUrl && sKey) ? fetch(`${sUrl.replace(/\/$/, "")}/api/v3/queue?apiKey=${sKey}`).then(r=>r.json()).catch(()=>[]) : Promise.resolve([]);
                let [rQ, sQ] = await Promise.all([rP, sP]);
                let combined = [];
                if(rQ.records) rQ = rQ.records; if(sQ.records) sQ = sQ.records;
                if(Array.isArray(rQ)) combined.push(...rQ.map(i => ({...i, clientType: 'radarr'})));
                if(Array.isArray(sQ)) combined.push(...sQ.map(i => ({...i, clientType: 'sonarr'})));
                activeTorrents = combined.map(t => ({
                    id: t.id, title: t.title || (t.movie ? t.movie.title : (t.series ? t.series.title : 'Unknown')),
                    totalSize: t.size || 0, downloaded: (t.size || 0) - (t.sizeleft || 0),
                    percent: t.size > 0 ? (((t.size - t.sizeleft) / t.size) * 100).toFixed(1) : 0,
                    status: t.status || 'Downloading', timeleft: t.timeleft || '', client: t.clientType
                }));
            } catch(e){}
            if(currentMediaMode === 'downloads') render();
        };

        async function fetchMediaCalendars() {
            let rUrl = localStorage.getItem('radarr_url'), rKey = localStorage.getItem('radarr_key');
            let sUrl = localStorage.getItem('sonarr_url'), sKey = localStorage.getItem('sonarr_key');
            let dStart = new Date(); dStart.setMonth(dStart.getMonth() - 1);
            let startStr = `${dStart.getFullYear()}-${String(dStart.getMonth() + 1).padStart(2,'0')}-01`;
            let dEnd = new Date(); dEnd.setMonth(dEnd.getMonth() + 3);
            let endStr = `${dEnd.getFullYear()}-${String(dEnd.getMonth() + 1).padStart(2,'0')}-01`;
            let newEvents = []; 
            if (rUrl && rKey) {
                try {
                    let res = await fetch(`${rUrl.trim().replace(/\/$/, "")}/api/v3/calendar?apiKey=${rKey.trim()}&start=${startStr}&end=${endStr}&unmonitored=false`);
                    let movies = await res.json();
                    if (Array.isArray(movies)) {
                        movies.forEach(m => {
                            let posterObj = m.images?.find(i => i.coverType === 'poster') || m.images?.[0];
                            let poster = posterObj ? (posterObj.remoteUrl || posterObj.url) : '';
                            let relDate = m.inCinemas || m.digitalRelease || m.physicalRelease;
                            if (relDate) newEvents.push({ id: 'rad_'+m.id, title: m.title, tmdbId: m.tmdbId, mediaType: 'movie', posterPath: poster, date: new Date(relDate) });
                        });
                    }
                } catch(e) {}
            }
            if (sUrl && sKey) {
                try {
                    let sRes = await fetch(`${sUrl.trim().replace(/\/$/, "")}/api/v3/series?apiKey=${sKey.trim()}`); 
                    let sData = await sRes.json(); 
                    let seriesMap = {};
                    if (Array.isArray(sData)) { sData.forEach(s => seriesMap[s.id] = s); }
                    
                    let res = await fetch(`${sUrl.trim().replace(/\/$/, "")}/api/v3/calendar?apiKey=${sKey.trim()}&start=${startStr}&end=${endStr}&unmonitored=false`);
                    let eps = await res.json();
                    if (Array.isArray(eps)) {
                        eps.forEach(e => {
                            let sObj = seriesMap[e.seriesId] || e.series;
                            let posterObj = sObj?.images?.find(i => i.coverType === 'poster') || sObj?.images?.[0];
                            let poster = posterObj ? (posterObj.remoteUrl || posterObj.url) : '';
                            let dt = new Date(e.airDateUtc || e.airDate);
                            newEvents.push({ id: 'son_'+e.id, title: sObj ? sObj.title : 'Unknown', tmdbId: sObj?.tmdbId, tvdbId: sObj?.tvdbId, mediaType: 'tv', posterPath: poster, date: dt });
                        });
                    }
                } catch(e) {}
            }
            calendarEvents = newEvents;
            if (currentMediaMode === 'movies' || currentMediaMode === 'shows') render();
        }

        async function triggerUniversalSearch(q) {
            let tk = localStorage.getItem('tmdb_key'); if(!tk || !q.trim()) return;
            try {
                let res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${tk.trim()}&query=${encodeURIComponent(q)}`);
                let d = await res.json();
                searchResultsData = (d.results || []).filter(r => r.media_type === 'movie' || r.media_type === 'tv').map(m => ({
                    id: m.id, tmdbId: m.id, title: m.title || m.name, posterPath: m.poster_path ? 'https://image.tmdb.org/t/p/w500'+m.poster_path : '',
                    mediaType: m.media_type, year: (m.release_date || m.first_air_date || '').split('-')[0], overview: m.overview, rating: m.vote_average?m.vote_average.toFixed(1):'0.0'
                }));
                render();
            } catch(e){}
        }

        function launchModalFromAttributes(pool, id, track) {
            activeItem = null;
            if (pool === 'discover_movie') {
                activeItem = track === 'Foreign Cinema' ? (window.foreignMoviesData || []).find(m => String(m.id) === String(id)) : (movieTracks[track] || []).find(m => String(m.id) === String(id));
            } else if (pool === 'discover_tv') {
                activeItem = (tvTracks[track] || []).find(m => String(m.id) === String(id));
            } else if (pool === 'search') {
                activeItem = searchResultsData.find(m => String(m.id) === String(id));
            } else if (pool === 'library') {
                activeItem = myCollection.find(m => String(m.id) === String(id));
            } else if (pool === 'watched_track') {
                activeItem = customWatchedHistory.find(m => String(m.id) === String(id));
            } else if (pool === 'shows') {
                activeItem = myShows.find(m => String(m.id) === String(id));
            } else if (pool === 'friend') {
                activeItem = friendRowData.find(m => String(m.id) === String(id) || String(m.title) === String(id));
            }
            if(activeItem) {
                modalOpen = true; render();
                let ok = localStorage.getItem('omdb_key');
                if(ok && !activeItem.omdbRatings) {
                    let yr = parseNumericYear(activeItem);
                    fetch(`https://www.omdbapi.com/?apikey=${ok.trim()}&t=${encodeURIComponent(activeItem.title)}${yr ? '&y='+yr : ''}`).then(r=>r.json()).then(d => {
                        if (d.Response !== "False" && d.Ratings) { activeItem.omdbRatings = d.Ratings; if(modalOpen) render(); }
                    }).catch(()=>{});
                }
            }
        }
        window.toggleWatchlist = function() {
            if(!activeItem) return;
            let idx = customWatchedHistory.findIndex(m => window.isItemMatch(m, activeItem));
            if(idx >= 0) {
                customWatchedHistory.splice(idx, 1);
                let cId = localWatchedCache.findIndex(id => id === String(activeItem.tmdbId || activeItem.id)); if(cId >= 0) localWatchedCache.splice(cId, 1);
                let cTl = localWatchedCache.findIndex(id => id === String(activeItem.title).toLowerCase().trim()); if(cTl >= 0) localWatchedCache.splice(cTl, 1);
                showAppNotification('Removed from Watched List');
            } else {
                customWatchedHistory.push({...activeItem, hasFile: false});
                if(activeItem.tmdbId || activeItem.id) localWatchedCache.push(String(activeItem.tmdbId || activeItem.id));
                if(activeItem.title) localWatchedCache.push(String(activeItem.title).toLowerCase().trim());
                showAppNotification('Added to Watched List');
            }
            localStorage.setItem('custom_watched_history', JSON.stringify(customWatchedHistory));
            localStorage.setItem('local_watched_cache', JSON.stringify(localWatchedCache));
            render();
        };

        window.addToRadarr = async function() {
            let u = localStorage.getItem('radarr_url'), k = localStorage.getItem('radarr_key'); if(!u || !k) return showAppNotification('Config Radarr first.');
            try {
                u = u.replace(/\/$/, ""); if(!u.startsWith('http')) u = 'http://' + u;
                let rf = await fetch(`${u}/api/v3/rootfolder?apiKey=${k}`).then(r=>r.json()), rPath = rf.length > 0 ? rf[0].path : '';
                let qp = await fetch(`${u}/api/v3/qualityprofile?apiKey=${k}`).then(r=>r.json()), qId = qp.length > 0 ? qp[0].id : 1;
                let res = await fetch(`${u}/api/v3/movie?apiKey=${k}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: activeItem.title, tmdbId: parseInt(activeItem.tmdbId || activeItem.id, 10), qualityProfileId: qId, rootFolderPath: rPath, monitored: true, addOptions: { searchForMovie: true } })});
                if(res.ok || res.status === 201) { showAppNotification('Added to Radarr!'); if(!myCollection.some(m => window.isItemMatch(m, activeItem))) { myCollection.push({...activeItem, hasFile: false}); localStorage.setItem('local_collection', JSON.stringify(myCollection)); render(); } }
                else { let err = await res.json(); showAppNotification('Radarr Error: ' + (err[0]?.errorMessage || res.statusText)); }
            } catch(e){ showAppNotification('Radarr Link Failed'); }
        };

        window.addToSonarr = async function() {
            let u = localStorage.getItem('sonarr_url'), k = localStorage.getItem('sonarr_key'); if(!u || !k) return showAppNotification('Config Sonarr first.');
            try {
                u = u.replace(/\/$/, ""); if(!u.startsWith('http')) u = 'http://' + u;
                let tvdbId = activeItem.tvdbId;
                if(!tvdbId) {
                    let tmk = localStorage.getItem('tmdb_key');
                    if(tmk) { let ext = await fetch(`https://api.themoviedb.org/3/tv/${activeItem.tmdbId || activeItem.id}/external_ids?api_key=${tmk.trim()}`).then(r=>r.json()); tvdbId = ext.tvdb_id; }
                }
                if(!tvdbId) return showAppNotification('Missing TVDB ID');
                let rf = await fetch(`${u}/api/v3/rootfolder?apiKey=${k}`).then(r=>r.json()), rPath = rf.length > 0 ? rf[0].path : '';
                let qp = await fetch(`${u}/api/v3/qualityprofile?apiKey=${k}`).then(r=>r.json()), qId = qp.length > 0 ? qp[0].id : 1;
                let res = await fetch(`${u}/api/v3/series?apiKey=${k}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ title: activeItem.title, tvdbId: parseInt(tvdbId, 10), qualityProfileId: qId, rootFolderPath: rPath, monitored: true, addOptions: { searchForMissingEpisodes: true } })});
                if(res.ok || res.status === 201) { showAppNotification('Added to Sonarr!'); if(!myShows.some(s => window.isItemMatch(s, activeItem))) { myShows.push({...activeItem, tvdbId: tvdbId, hasFile: false}); localStorage.setItem('local_shows', JSON.stringify(myShows)); render(); } }
                else { let err = await res.json(); showAppNotification('Sonarr Error: ' + (err[0]?.errorMessage || res.statusText)); }
            } catch(e){ showAppNotification('Sonarr Link Failed'); }
        };

        window.playOnJellyfin = function() {
            let u = localStorage.getItem('jf_url'); if(!u) return showAppNotification('Jellyfin URL missing.');
            u = u.replace(/\/$/, ""); if(!u.startsWith('http')) u = 'http://' + u;

        function renderRow(title, movies, isFriend = false, pool = 'discover_movie') {
            let displayList = movies.filter(m => !localWatchedCache.includes(String(m.title).toLowerCase().trim()) && (!m.tmdbId || !localWatchedCache.includes(String(m.tmdbId))));
            if (displayList.length === 0) return '';
            return `<div class="row-container"><h3 class="row-title">${isFriend ? '🔥' : '📦'} ${title}</h3><div class="scroll-row">` + displayList.map((m) => {
                let lookupKey = m.id || m.tmdbId || m.title;
                let cleanYearNumeric = parseNumericYear(m);
                let displayMeta = cleanYearNumeric > 0 ? cleanYearNumeric : '';
                return `<div class="scroll-card movie-trigger" data-pool="${pool}" data-id="${lookupKey}" data-track="${title}"><div class="scroll-poster">${m.posterPath ? `<img class="scroll-poster-img" src="${m.posterPath}">` : `<div style="font-weight:bold; font-size:10px; padding:12px;">${m.title}</div>`}<span class="rating-badge">${m.rating}</span></div><div class="card-details"><div class="card-title">${m.title}</div><div class="card-meta">${displayMeta}</div></div></div>`;
            }).join('') + `</div></div>`;
        }

                    if (ev.mediaType === 'tv' && ev.tvdbId && !seenTvIds.has(ev.tvdbId)) {
                        seenTvIds.add(ev.tvdbId);
                        comingSoonShows.push({ id: ev.id, tmdbId: ev.tmdbId, tvdbId: ev.tvdbId, title: ev.title.replace(/^(🍿|💻|💿|📺)\s*/, ''), posterPath: ev.posterPath, year: ev.date ? ev.date.getFullYear() : '' });
                    }
                });

                let downloadedShows = myShows.filter(s => s.hasFile);
                let filtered = currentShowSubTab === 'downloaded' ? downloadedShows : comingSoonShows;
                let poolShows = currentShowSubTab === 'comingsoon' ? 'calendar' : 'shows';
                
                body = `
                    <div class="stats-grid">
                        <div onclick="switchShowSubTab('downloaded')" class="stat-card ${currentShowSubTab==='downloaded'?'active-sub-tab':''}"><div class="stat-num" style="color:#10b981;">${downloadedShows.length}</div><div class="stat-lbl">Downloaded</div></div>
                        <div onclick="switchShowSubTab('comingsoon')" class="stat-card ${currentShowSubTab==='comingsoon'?'active-sub-tab':''}"><div class="stat-num" style="color:#3b82f6;">${comingSoonShows.length}</div><div class="stat-lbl">Coming Soon</div></div>
                    </div>
                    <div class="movie-grid" style="margin-top:16px;">${filtered.map(s=>`<div class="movie-card movie-trigger" data-pool="${poolShows}" data-id="${s.id}"><div class="poster-slot"><img class="grid-poster-img" src="${s.posterPath||''}"></div><div class="grid-card-details">${s.title}</div></div>`).join('')}</div>
                `;
            } else if (currentMediaMode === 'foryou') {
                let tabs = `<div class="stats-grid"><div onclick="switchForYouSubTab('movies')" class="stat-card ${currentForYouSubTab==='movies'?'active-sub-tab':''}"><div class="stat-lbl">Movies</div></div><div onclick="switchForYouSubTab('shows')" class="stat-card ${currentForYouSubTab==='shows'?'active-sub-tab':''}"><div class="stat-lbl">TV Shows</div></div></div>`;
                if(currentForYouSubTab === 'movies') {
                    body = tabs + renderRow("Friends' Picks", friendRowData, true, 'friend') + Object.entries(movieTracks).map(([t, m]) => renderRow(t, m, false, 'discover_movie')).join('') + renderRow("Foreign Cinema", window.foreignMoviesData||[], false, 'discover_movie');
                } else {
                    body = tabs + Object.entries(tvTracks).map(([t, s]) => renderRow(t, s, false, 'discover_tv')).join('');
                }
            } else if (currentMediaMode === 'downloads') {
                body = activeTorrents.length === 0 ? `<div style="text-align:center; padding:40px; color:#64748b;">No active entries</div>` : `<div style="display:flex; flex-direction:column; gap:12px;">` + activeTorrents.map(t => `<div class="torrent-card"><div class="torrent-title">${t.title}</div><div class="torrent-meta"><span>${formatBytes(t.downloaded)} / ${formatBytes(t.totalSize)} • ${t.percent}%</span><span style="background:#1e293b; color:#fff; padding:2px 6px; border-radius:4px;">${t.client}</span></div><div class="torrent-progress-bg"><div class="torrent-progress-fill" style="width:${t.percent}%; background:#8b5cf6;"></div></div><div class="torrent-meta" style="margin-top:8px;"><span style="color:#8b5cf6; font-weight:800;">${t.status}</span><span>${t.timeleft?'⏳ '+t.timeleft:''}</span></div></div>`).join('') + `</div>`;
            } else if (currentMediaMode === 'settings') {
                body = `
                    <div class="settings-container">
                        <div class="form-group"><label>Radarr URL</label><input type="text" id="in_radarr_url" value="${localStorage.getItem('radarr_url')||''}"></div>
                        <div class="form-group"><label>Radarr Key</label><input type="password" id="in_radarr_key" value="${localStorage.getItem('radarr_key')||''}"></div>
                        <div class="form-group"><label>Sonarr URL</label><input type="text" id="in_sonarr_url" value="${localStorage.getItem('sonarr_url')||''}"></div>
                        <div class="form-group"><label>Sonarr Key</label><input type="password" id="in_sonarr_key" value="${localStorage.getItem('sonarr_key')||''}"></div>
                        <div class="form-group"><label>Jellyfin URL</label><input type="text" id="in_jf_url" value="${localStorage.getItem('jf_url')||''}"></div>
                        <div class="form-group"><label>Letterboxd Usernames</label><textarea id="in_lb" placeholder="user1\\nuser2">${localStorage.getItem('lb_links')||''}</textarea></div>
                        <div class="form-group"><label>TMDB Key (v3)</label><input type="text" id="in_tmdb" value="${localStorage.getItem('tmdb_key')||''}"></div>
                        <div class="form-group"><label>OMDb Key</label><input type="password" id="in_omdb" value="${localStorage.getItem('omdb_key')||''}"></div>
                        <button onclick="localStorage.setItem('radarr_url', document.getElementById('in_radarr_url').value.trim()); localStorage.setItem('radarr_key', document.getElementById('in_radarr_key').value.trim()); localStorage.setItem('sonarr_url', document.getElementById('in_sonarr_url').value.trim()); localStorage.setItem('sonarr_key', document.getElementById('in_sonarr_key').value.trim()); localStorage.setItem('jf_url', document.getElementById('in_jf_url').value.trim()); localStorage.setItem('lb_links', document.getElementById('in_lb').value.trim()); localStorage.setItem('tmdb_key', document.getElementById('in_tmdb').value.trim()); localStorage.setItem('omdb_key', document.getElementById('in_omdb').value.trim()); showAppNotification('Saved Core Matrix Config!'); loadDiscoverTracks(); window.syncFeeds(); fetchMediaCalendars();" class="btn-action">Save Media Settings</button>
                        <div style="margin-top: 20px; padding: 15px; border: 1px dashed #cbd5e1; border-radius: 12px; background: #ffffff;">
                            <h4 style="margin-top:0; color: #0f172a; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px;">App Backup</h4>
                            <div style="display:flex; gap:10px; margin-bottom:10px;">
                                <button onclick="exportWatchedList()" style="flex:1; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-weight:800; font-size:11px; text-transform:uppercase; cursor: pointer;">Export Data</button>
                                <button onclick="importWatchedList()" style="flex:1; padding: 12px; background: #10b981; color: white; border: none; border-radius: 8px; font-weight:800; font-size:11px; text-transform:uppercase; cursor: pointer;">Import Data</button>
                            </div>
                            <textarea id="migrationBox" placeholder="Exported data will appear here..." style="width: 100%; height: 80px; background: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; border-radius: 8px; padding: 10px; box-sizing: border-box; font-family: monospace; font-size: 11px;"></textarea>
                        </div>
                    </div>
                `;
            }

            if(modalOpen && activeItem) {
                let rVal = activeItem.rating || '0.0';
                let extra = `<div style="display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;"><span style="background:#ea580c; color:#fff; padding:3px 8px; border-radius:6px; font-weight:800; font-size:11px;">★ TMDB ${rVal}</span>`;
                if(activeItem.omdbRatings) {
                    let im = activeItem.omdbRatings.find(r => r.Source === 'Internet Movie Database');
                    if(im) extra += `<span style="background:#f5c518; color:#000; padding:3px 8px; border-radius:6px; font-weight:800; font-size:11px;">IMDb ${im.Value}</span>`;
                }
                extra += `</div>`;
                let isW = customWatchedHistory.some(m => window.isItemMatch(m, activeItem));
                modal = `
                    <div class="modal-overlay"><div class="modal-bg" style="background-image:url('${activeItem.posterPath||''}');"></div><div class="modal-bg-tint"></div>
                        <div class="detail-close-trigger" onclick="closeM()">×</div>
                        <div class="detail-content-frame">
                            <div class="detail-main-row">
                                <div class="detail-poster-wrapper"><img class="detail-poster-img" src="${activeItem.posterPath||''}"></div>
                                <div class="detail-meta-block"><h3 class="detail-heading-title">${activeItem.title}</h3><p class="detail-sub-specs">${activeItem.year||''}</p>${extra}</div>
                            </div>
                            <div class="detail-synopsis-box"><h4>Summary</h4><div>${activeItem.overview||'No summary index generated.'}</div></div>
                            <div class="detail-footer-actions">
                                <button class="btn-action" style="background:#8b5cf6;" onclick="${activeItem.mediaType==='tv'?'addToSonarr()':'addToRadarr()'}">Send to Downloader</button>
                                <button class="btn-action" style="background:linear-gradient(90deg, #3b82f6 0%, #2563eb 100%);" onclick="playOnJellyfin()">Stream on Player</button>
                                <button class="btn-action" style="background:${isW?'#ef4444':'#10b981'};" onclick="toggleWatchlist()">${isW?'Remove from Watched Matrix':'Add to Watched History'}</button>
                            </div>
                        </div>
                    </div>
                `;
            }
            out.innerHTML = searchHtml + searchRow + body + modal;
        }

        document.addEventListener('click', function(e) {
            let tc = e.target.closest('.movie-trigger');
            if(tc) { e.preventDefault(); launchModalFromAttributes(tc.getAttribute('data-pool'), tc.getAttribute('data-id'), tc.getAttribute('data-track')); }
        });

        function safeInit() {
            try {
                if (typeof window.syncFeeds === 'function') window.syncFeeds();
                if (typeof loadDiscoverTracks === 'function') loadDiscoverTracks();
                if (typeof fetchMediaCalendars === 'function') fetchMediaCalendars();
                if (currentMediaMode === 'downloads' && typeof syncDownloadQueue === 'function') syncDownloadQueue();
            } catch (e) { console.error(e); }
        }

        render(); safeInit();
        setInterval(() => { if(currentMediaMode === 'downloads') syncDownloadQueue(); }, 4000);
    </script>
</body>
</html>

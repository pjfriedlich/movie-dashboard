<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Movie Tracker Dashboard</title>
    <style>
        html, body { background: #f1f5f9; color: #0f172a; font-family: -apple-system, sans-serif; margin: 0; padding: 12px 8px 100px 8px; box-sizing: border-box; }
        .header { display: flex; gap: 10px; margin-bottom: 20px; }
        .search-input { flex: 1; padding: 12px; border-radius: 12px; border: 1px solid #cbd5e1; }
        .nav-footer { position: fixed; bottom: 0; left: 0; right: 0; height: 80px; background: #fff; border-top: 1px solid #cbd5e1; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); z-index: 1000; }
        .nav-btn { background: none; border: none; font-weight: bold; color: #64748b; cursor: pointer; }
        .nav-btn.active { color: #f97316; }
        .torrent-card { background: #fff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 15px; margin-bottom: 10px; }
        .btn-stop { background: #f97316; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #f97316; color: white; padding: 10px 20px; border-radius: 20px; z-index: 2000; display: none; }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>
    <div id="view-root"></div>
    <div class="nav-footer">
        <button class="nav-btn" onclick="switchTab('collection')">Movies</button>
        <button class="nav-btn" onclick="switchTab('foryou')">For You</button>
        <button class="nav-btn" onclick="switchTab('downloads')">Downloads</button>
        <button class="nav-btn" onclick="switchTab('settings')">Settings</button>
    </div>
    <script>
        let currentTab = localStorage.getItem('app_current_tab') || 'collection';
        
        function showToast(msg) {
            let t = document.getElementById('toast');
            t.innerText = msg; t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 3000);
        }

        function switchTab(t) { localStorage.setItem('app_current_tab', t); currentTab = t; render(); }

        async function syncDownloads() {
            let url = localStorage.getItem('radarr_url'), key = localStorage.getItem('radarr_key');
            if(!url || !key) return;
            try {
                let res = await fetch(`${url.replace(/\/$/, "")}/api/v3/queue?apiKey=${key}`);
                let list = await res.json();
                let records = Array.isArray(list) ? list : (list.records || []);
                document.getElementById('view-root').innerHTML = records.map(t => `
                    <div class="torrent-card">
                        <div>${t.title}</div>
                        <div style="font-size: 12px; color: #64748b;">Status: ${t.status}</div>
                        <button class="btn-stop" onclick="toggleTransfer('${t.id}', '${t.status}')">Toggle Status</button>
                    </div>
                `).join('');
            } catch(e) { showToast("Radarr Connection Error"); }
        }

        async function toggleTransfer(id, status) {
            let url = localStorage.getItem('radarr_url'), key = localStorage.getItem('radarr_key');
            let action = (status.toLowerCase().includes('paused') || status.toLowerCase().includes('stop')) ? 'resume' : 'pause';
            try {
                let res = await fetch(`${url.replace(/\/$/, "")}/api/v3/queue/${action}?apiKey=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ queueItemIds: [parseInt(id)] })
                });
                if(res.ok) { showToast("Success!"); syncDownloads(); }
                else showToast("Server Error");
            } catch(e) { showToast("Connection Failure"); }
        }

        function render() {
            if(currentTab === 'downloads') syncDownloads();
            else if(currentTab === 'settings') {
                document.getElementById('view-root').innerHTML = `
                    <div class="settings-container">
                        <input type="text" id="r_url" placeholder="Radarr URL" value="${localStorage.getItem('radarr_url')||''}">
                        <input type="password" id="r_key" placeholder="API Key" value="${localStorage.getItem('radarr_key')||''}">
                        <button onclick="localStorage.setItem('radarr_url', document.getElementById('r_url').value); localStorage.setItem('radarr_key', document.getElementById('r_key').value); alert('Saved!')">Save</button>
                    </div>
                `;
            }
        }
        render();
    </script>
</body>
</html>

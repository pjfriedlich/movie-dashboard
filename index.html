<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Movie Tracker Dashboard</title>
    <link rel="manifest" href="manifest.json">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
      }
    </script>
    <style>
        body { background:#020617; color:#f8fafc; font-family:sans-serif; margin:0; padding:16px 16px 95px 16px; box-sizing:border-box; }
        
        .header { display:flex; width:100%; align-items:center; border-bottom:1px solid #1e293b; padding-bottom:14px; margin-bottom:20px; box-sizing:border-box; }
        .search-wrapper { position:relative; width:100%; display:flex; gap:10px; }

        #pull-indicator { 
            width: 100%; 
            height: 0px; 
            overflow: hidden; 
            text-align: center; 
            background: #0f172a; 
            color: #f97316; 
            font-size: 11px;

            display: flex !important;
            flex-direction: row !important;
            gap: 10px !important;

            width: 100% !important;

        }

            flex: 1 !important;

            border: 1px solid #1e293b; 
            padding: 12px 4px;

            text-align: center; 
            display: flex !important; 
            flex-direction: column !important;

            background: #0f172a;

            border-radius: 12px;

        .grid-card-details { padding:10px; font-size:11px; font-weight:bold; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; background:#0f172a; border-top:1px solid #1e293b; box-sizing:border-box; text-align:left; }

        .row-container { margin-bottom:24px; width:100%; display:block; }
        .row-title { font-size:13px; font-weight:900; color:#cbd5e1; text-transform:uppercase; margin-bottom:12px; margin-top:0; }
        .scroll-row { display:flex; flex-direction:row; flex-wrap:nowrap; gap:14px; overflow-x:auto; padding-bottom:12px; width:100%; box-sizing:border-box; -webkit-overflow-scrolling:touch; }
        .scroll-card { background:#0f172a; border:1px solid #1e293b; border-radius:12px; width:135px; min-width:135px; max-width:135px; display:flex; flex-direction:column; overflow:hidden; flex-shrink:0; cursor:pointer; box-sizing:border-box; }
        .scroll-poster { width:100%; height:195px; min-height:195px; background:#1e293b; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; box-sizing:border-box; }
        .rating-badge { position:absolute; bottom:8px; right:8px; background:#020617; border:1px solid #1e293b; color:#34d399; font-weight:bold; font-size:9px; padding:2px 6px; border-radius:4px; }
        .card-details { padding:10px; background:#0f172a; text-align:left; box-sizing:border-box; }
        .card-title { font-weight:bold; font-size:11px; color:#e2e8f0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        .card-title span { background:#1e293b; color:#fbbf24; font-size:8px; padding:2px 5px; border-radius:4px; margin-left:4px; vertical-align:middle; }
        .card-meta { font-size:9px; color:#64748b; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
        
        .settings-container { display:flex; flex-direction:column; gap:16px; padding:4px 0; width:100%; box-sizing:border-box; }
        .form-group { display:flex; flex-direction:column; gap:8px; width:100%; box-sizing:border-box; }
        .form-group label { font-size:11px; font-weight:900; color:#94a3b8; text-transform:uppercase; letter-spacing:0.5px; }
        .form-group input, .form-group textarea { background:#0f172a; border:1px solid #1e293b; border-radius:12px; padding:14px; color:#f8fafc; font-size:14px; outline:none; width:100%; box-sizing:border-box; transition:border-color 0.2s, background 0.2s; }
        .form-group input:focus, .form-group textarea:focus { border-color:#f97316; background:#111827; }
        .form-group textarea { height:90px; resize:vertical; font-family:sans-serif; }
        .btn-action { width:100%; padding:15px; background:#f97316; color:#020617; border:none; border-radius:12px; font-weight:900; text-transform:uppercase; font-size:11px; cursor:pointer; transition:background 0.2s; margin-top:8px; letter-spacing:0.5px; }
        .btn-action:hover { background:#ea580c; }

        .nav-footer { position:fixed; bottom:0; left:0; right:0; background:rgba(15, 23, 42, 0.95); border-top:1px solid #1e293b; padding:12px 14px; display:flex; justify-content:space-around; backdrop-filter:blur(8px); z-index:40; box-sizing:border-box; }
        .nav-btn { background:none; border:none; color:#64748b; font-weight:bold; font-size:10px; text-transform:uppercase; display:flex; flex-direction:column; align-items:center; cursor:pointer; gap:4px; }
        .nav-btn.active { color:#f97316; }

        .modal-overlay { position:fixed; inset:0; background:#020617; z-index:100; box-sizing:border-box; overflow-y:auto; padding:0; display:flex; flex-direction:column; }
        .detail-hero-backdrop { width:100%; height:260px; background-size:cover; background-position:center; position:relative; }
        .detail-hero-backdrop::after { content:''; position:absolute; inset:0; background:linear-gradient(to bottom, transparent 30%, #020617 100%); }
        .detail-close-trigger { position:absolute; top:20px; right:20px; background:rgba(15,23,42,0.8); border:1px solid #1e293b; color:#f8fafc; font-size:18px; font-weight:bold; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:110; }
        .detail-content-frame { padding:0 20px 40px 20px; margin-top:-80px; position:relative; z-index:105; display:flex; flex-direction:column; gap:20px; }
        .detail-main-row { display:flex; gap:16px; align-items:flex-end; }
        .detail-poster-wrapper { width:110px; height:165px; border-radius:8px; overflow:hidden; border:2px solid #1e293b; background:#0f172a; flex-shrink:0; box-shadow:0 10px 25px rgba(0,0,0,0.5); }

        .detail-meta-block { display:flex; flex-direction:column; gap:6px; }
        .detail-heading-title { font-size:22px; font-weight:900; color:#ffffff; line-height:1.2; }
        .detail-sub-specs { font-size:11px; color:#94a3b8; font-weight:600; }
        
        .detail-metrics-rack { display:grid; grid-template-cols:1fr 1fr; gap:10px; background:#0f172a; border:1px solid #1e293b; padding:12px; border-radius:12px; }
        .metric-pill { display:flex; align-items:center; gap:8px; font-size:12px; font-weight:bold; color:#cbd5e1; }

        .metric-txt span { color:#f97316; font-weight:900; }
        .metric-txt .rt-score { color:#ef4444; }
        
        .detail-synopsis-box { font-size:13px; color:#cbd5e1; line-height:1.6; }
        .detail-synopsis-box h4 { font-size:10px; text-transform:uppercase; color:#64748b; letter-spacing:1px; margin-bottom:6px; }
        .detail-footer-actions { display:flex; flex-direction:column; gap:10px; margin-top:10px; }
        .btn-panel-primary { width:100%; padding:14px; background:#f97316; color:#020617; border:none; border-radius:12px; font-weight:900; text-transform:uppercase; font-size:11px; cursor:pointer; }
        .btn-panel-secondary { width:100%; padding:14px; background:#1e293b; color:#cbd5e1; border:1px solid #334155; border-radius:12px; font-weight:900; text-transform:uppercase; font-size:11px; cursor:pointer; }
        .btn-panel-disabled { width:100%; padding:14px; background:#334155; color:#64748b; border:none; border-radius:12px; font-weight:900; text-transform:uppercase; font-size:11px; cursor:not-allowed; }

</head>
<body>
    <div id="pull-indicator">⬇️ Pull down to refresh...</div>
    <div id="view-root"></div>
        <script>
        let currentTab = 'collection', modalOpen = false, activeItem = null, friendRowData = [], isRadarrLoading = false;
        let currentSubTab = 'downloaded'; 
        let searchResultsData = []; 
        let myCollection = JSON.parse(localStorage.getItem('local_collection')) || [];
        let tracks = { "Action": [], "Comedy": [], "Drama": [], "Adventure": [], "Mystery": [], "Sci-Fi": [], "1960s": [], "1970s": [], "1980s": [], "1990s": [], "2000s": [] };
        let localWatchedCache = JSON.parse(localStorage.getItem('local_watched_cache')) || [];

        let startY = 0;
        let isPulling = false;

        function switchSubTab(targetTab) {
            currentSubTab = targetTab;
            render();
        }

        function launchModalFromAttributes(poolType, targetKey, trackName = null) {
            try {
                let targetObject = null;
                
                if (poolType === 'search') {
                    targetObject = searchResultsData[parseInt(targetKey)];
                } else if (poolType === 'friend') {
                    targetObject = friendRowData[parseInt(targetKey)];
                } else if (poolType === 'discover') {
                    targetObject = tracks[trackName]?.[parseInt(targetKey)];
                } else if (poolType === 'library') {
                    targetObject = myCollection.find(m => String(m.id).trim() === String(targetKey).trim());
                }

                if (!targetObject) return;

                activeItem = JSON.parse(JSON.stringify(targetObject));
                modalOpen = true;
                render();

                let tk = localStorage.getItem('tmdb_key');
                if (tk && activeItem.tmdbId && !isNaN(activeItem.tmdbId)) {
                    fetch(`https://api.themoviedb.org/3/movie/${activeItem.tmdbId}?api_key=${tk}`)
                        .then(res => { if (!res.ok) throw new Error(); return res.json(); })
                        .then(d => {
                            if (d && modalOpen) {
                                activeItem.overview = d.overview || activeItem.overview;
                                activeItem.runtime = d.runtime ? `${d.runtime}m` : '104m';
                                activeItem.vote_average = d.vote_average ? d.vote_average.toFixed(1) : null;
                                activeItem.backdrop_path = d.backdrop_path ? `https://image.tmdb.org/t/p/w780${d.backdrop_path}` : '';
                                render();
                            }
                        }).catch(() => console.log("Pre-cached local properties used."));
                }
            } catch (e) {
                console.error("Delegated selection structural exception caught cleanly: ", e);
            }
        }

        function executeToggleWatched() {
            if (!activeItem) return;
            let titleStr = String(activeItem.title);
            let tmdbIdStr = activeItem.tmdbId ? String(activeItem.tmdbId) : null;
            let internalIdStr = activeItem.id ? String(activeItem.id) : null;
            
            let customHistory = JSON.parse(localStorage.getItem('custom_watched_history')) || [];
            
            if (tmdbIdStr && !localWatchedCache.includes(tmdbIdStr)) localWatchedCache.push(tmdbIdStr);
            if (internalIdStr && !localWatchedCache.includes(internalIdStr)) localWatchedCache.push(internalIdStr);
            if (!localWatchedCache.includes(titleStr)) localWatchedCache.push(titleStr);
            
            localStorage.setItem('local_watched_cache', JSON.stringify(localWatchedCache));
            
            myCollection.forEach(m => {
                if (String(m.id) === internalIdStr || String(m.tmdbId) === tmdbIdStr || String(m.title) === titleStr) {
                    m.played = true;
                }
            });
            
            let existsInCollection = myCollection.some(m => String(m.id) === internalIdStr || (m.tmdbId && String(m.tmdbId) === tmdbIdStr) || String(m.title) === titleStr);
            
            if (!existsInCollection) {
                let customItem = {
                    id: internalIdStr || 'cust_' + Date.now(),
                    title: activeItem.title,
                    year: activeItem.year || 'N/A',
                    overview: activeItem.overview || 'Manually logged discovered watchlist entry.',
                    rating: activeItem.rating || '7.5',
                    tmdbId: activeItem.tmdbId || null,
                    played: true,
                    hasFile: false,
                    posterPath: activeItem.posterPath || ''
                };
                myCollection.unshift(customItem);
                
                if (!customHistory.some(h => h.title === customItem.title)) {
                    customHistory.push(customItem);
                    localStorage.setItem('custom_watched_history', JSON.stringify(customHistory));
                }
            }
            
            localStorage.setItem('local_collection', JSON.stringify(myCollection));
            modalOpen = false;
            currentTab = 'collection';
            currentSubTab = 'watched';
            render();
        }

        async function triggerUniversalSearch(queryText) {
            let tk = localStorage.getItem('tmdb_key'); let query = queryText.trim();
            if (!query || !tk) { searchResultsData = []; render(); return; }
            try {
                let url = `https://api.themoviedb.org/3/search/movie?api_key=${tk}&query=${encodeURIComponent(query)}&with_original_language=en`;
                let data = await (await fetch(url)).json();
                if (data.results) {
                    searchResultsData = data.results.map(m => ({
                        title: m.title,
                        year: m.release_date ? m.release_date.substring(0,4) : 'N/A',
                        rating: m.vote_average ? m.vote_average.toFixed(1) : 'NR',
                        tmdbId: m.id,
                        posterPath: m.poster_path ? `https://image.tmdb.org/t/p/w200${m.poster_path}` : '',
                        overview: m.overview || ''
                    }));
                }
            } catch (e) { console.error(e); }
            render();
        }

        function clearGlobalSearch() {
            let inputField = document.getElementById('search-input');
            if (inputField) inputField.value = '';
            searchResultsData = [];
            render();
        }

        function closeM() { modalOpen = false; activeItem = null; render(); }
            async function syncRadarrLibrary() {
            let u = localStorage.getItem('radarr_url'), k = localStorage.getItem('radarr_key'); if (!u || !k) return;
            isRadarrLoading = true; render();
            try {
                let response = await fetch(`${u.replace(/\/$/, "")}/api/v3/movie?apiKey=${k}`);
                let items = await response.json();
                if (Array.isArray(items)) {
                    let serverItems = items.map((item) => {
                        let tmdbIdStr = item.tmdbId ? String(item.tmdbId) : null;
                        let titleStr = String(item.title);
                        
                        let matchPlayed = localWatchedCache.includes(tmdbIdStr) || 
                                          localWatchedCache.includes(titleStr) || 
                                          localWatchedCache.includes(titleStr.toLowerCase().trim());
                        
                        let poster = '';
                        let posterObj = item.images?.find(i => i.coverType === 'poster');
                        if (posterObj) {
                            poster = posterObj.remoteUrl || posterObj.url;
                        }

                        return {
                            id: String(item.id),
                            title: item.title,
                            year: item.year || 'N/A',
                            overview: item.overview || '',
                            rating: item.ratings?.value ? item.ratings.value.toFixed(1) : '7.5',
                            tmdbId: item.tmdbId || null,
                            played: matchPlayed,
                            hasFile: item.hasFile, 
                            posterPath: poster
                        };
                    });
                    
                    let customHistory = JSON.parse(localStorage.getItem('custom_watched_history')) || [];
                    customHistory.forEach(customItem => {
                        if (!serverItems.some(s => s.title.toLowerCase().trim() === customItem.title.toLowerCase().trim() || (s.tmdbId && String(s.tmdbId) === String(customItem.tmdbId)))) {
                            serverItems.unshift(customItem);
                        }
                    });
                    
                    myCollection = serverItems;
                    localStorage.setItem('local_collection', JSON.stringify(myCollection));
                }
            } catch(e) { alert("Radarr Sync Failed: " + e.message); }
            isRadarrLoading = false; render();
        }

        async function sendToRadarr() {
            if (!activeItem) return;
            let u = localStorage.getItem('radarr_url'), k = localStorage.getItem('radarr_key'); if (!u || !k) return alert("Configure Radarr settings!");
            try {
                let f = await (await fetch(`${u.replace(/\/$/, "")}/api/v3/rootfolder?apiKey=${k}`)).json();
                let profiles = await (await fetch(`${u.replace(/\/$/, "")}/api/v3/qualityprofile?apiKey=${k}`)).json();
                let l = await (await fetch(`${u.replace(/\/$/, "")}/api/v3/movie/lookup?term=tmdb:${activeItem.tmdbId || 238}&apiKey=${k}`)).json();
                let movieData = Array.isArray(l) ? l[0] : l; if (!movieData) return alert("Metadata match missing.");
                
                let targetProfile = profiles.find(p => p.name.toLowerCase().trim() === "auto movie");
                let profileIdToUse = targetProfile ? targetProfile.id : profiles[0].id;
                
                movieData.rootFolderPath = f[0].path; 
                movieData.qualityProfileId = profileIdToUse; 
                movieData.monitored = true; 
                movieData.addOptions = { searchForMovie: true };
                
                let postRes = await fetch(`${u.replace(/\/$/, "")}/api/v3/movie?apiKey=${k}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(movieData) });
                if (postRes.status === 201 || postRes.status === 200) { alert(`Injected directly into Radarr queues!`); modalOpen = false; await syncRadarrLibrary(); }
                else { let e = await postRes.json(); alert("Rejected: " + (e[0]?.errorMessage || "Exists")); }
            } catch(err) { alert("Radarr Connection Timed Out."); }
            render();
        }

        async function loadDiscoverTracks() {
            let tk = localStorage.getItem('tmdb_key'); if (!tk) return;
            let genres = { "Action": "28", "Comedy": "35", "Drama": "18", "Adventure": "12", "Mystery": "9648", "Sci-Fi": "878" };
            let decades = { "1960s": [1960, 1969], "1970s": [1970, 1979], "1980s": [1980, 1989], "1990s": [1990, 1999], "2000s": [2000, 2009] };
            try {
                for (let [title, gId] of Object.entries(genres)) {
                    let basePage = Math.floor(Math.random() * 4) + 1; 
                    let res1 = await (await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${tk}&with_genres=${gId}&sort_by=popularity.desc&with_original_language=en&page=${basePage}`)).json();
                    let res2 = await (await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${tk}&with_genres=${gId}&sort_by=popularity.desc&with_original_language=en&page=${basePage + 1}`)).json();
                    let combined = [...(res1.results || []), ...(res2.results || [])];
                    tracks[title] = combined.map(m => ({ title: m.title, year: m.release_date?.substring(0,4) || '', rating: m.vote_average ? m.vote_average.toFixed(1) : '7.0', tmdbId: m.id, posterPath: m.poster_path ? `https://image.tmdb.org/t/p/w200${m.poster_path}` : '', overview: m.overview || '' }));
                }
                for (let [title, range] of Object.entries(decades)) {
                    let basePage = Math.floor(Math.random() * 3) + 1;
                    let res1 = await (await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${tk}&primary_release_date.gte=${range[0]}-01-01&primary_release_date.lte=${range[1]}-12-31&sort_by=vote_average.desc&vote_count.gte=1000&with_original_language=en&page=${basePage}`)).json();
                    let res2 = await (await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${tk}&primary_release_date.gte=${range[0]}-01-01&primary_release_date.lte=${range[1]}-12-31&sort_by=vote_average.desc&vote_count.gte=1000&with_original_language=en&page=${basePage + 1}`)).json();
                    let combined = [...(res1.results || []), ...(res2.results || [])];
                    tracks[title] = combined.map(m => ({ title: m.title, year: m.release_date?.substring(0,4) || '', rating: m.vote_average ? m.vote_average.toFixed(1) : '7.0', tmdbId: m.id, posterPath: m.poster_path ? `https://image.tmdb.org/t/p/w200${m.poster_path}` : '', overview: m.overview || '' }));
                }
                if (currentTab === 'foryou') render();
            } catch(e) {}
        }
             async function syncFeeds() {
            let links = localStorage.getItem('lb_links'), tk = localStorage.getItem('tmdb_key'); if (!links) return;
            let arr = links.split(','), blended = [];
            for (let l of arr) {
                let cleanLine = l.trim();
                if (!cleanLine || cleanLine === '') continue;
                
                let user = cleanLine.replace(/\/$/, ""); 
                if (user.includes('letterboxd.com/')) {
                    user = user.split('letterboxd.com/')[1];
                }
                user = user.replace(/^\//, "").trim();
                if (!user || user === "") continue;
                
                try {
                    let cacheBuster = new Date().getTime();
                    let targetUrl = encodeURIComponent(`https://letterboxd.com/${user}/rss/?_cb=${cacheBuster}`);
                    let proxyPayload = await (await fetch(`https://api.allorigins.win/raw?url=${targetUrl}`)).text();
                    let items = new DOMParser().parseFromString(proxyPayload, "text/xml").getElementsByTagName("item");
                    for (let i = 0; i < Math.min(items.length, 35); i++) {
                        let t = (items[i].getElementsByTagName("title")[0]?.textContent || '').split(' - ')[0];
                        if (t && !blended.some(m => m.title === t)) {
                            let cId = 238, poster = '', syn = '';
                            if (tk) { 
                                try { 
                                    let titleMatch = t.match(/^(.+?),\s*(\d{4})$/); let cleanQuery = t; let releaseYear = "";
                                    if (titleMatch) { cleanQuery = titleMatch[1].trim(); releaseYear = titleMatch[2]; }
                                    let tmdbUrl = `https://api.themoviedb.org/3/search/movie?api_key=${tk}&query=${encodeURIComponent(cleanQuery)}`;
                                    if (releaseYear) tmdbUrl += `&primary_release_year=${releaseYear}`;
                                    let s = await (await fetch(tmdbUrl)).json(); 
                                    if (s.results?.[0]) { cId = s.results[0].id; poster = s.results[0].poster_path ? `https://image.tmdb.org/t/p/w200${s.results[0].poster_path}` : ''; syn = s.results[0].overview || ''; }
                                } catch(e){} 
                            }
                            blended.push({ id: 'lb_'+user+'_'+i, title: t, year: '@'+user, rating: 'Pick', tmdbId: cId, posterPath: poster, overview: syn });
                        }
                    }
                } catch(e) {}
            }
            friendRowData = blended; render();
        }

        function renderRow(title, movies, isFriend = false) {
            let rowType = isFriend ? 'friend' : 'discover';
            return `<div class="row-container"><h3 class="row-title">${isFriend ? '🔥' : '🎬'} ${title}</h3><div class="scroll-row">
                ${movies.length === 0 ? `<div style="font-size:11px; color:#64748b; padding:12px;">Loading track entries...</div>` : movies.map((m, idx) => {
                    return `<div class="scroll-card movie-trigger" data-pool="${rowType}" data-key="${idx}" data-track="${title}">
                        <div class="scroll-poster" style="${m.posterPath ? `background:url('${m.posterPath}') center/cover no-repeat;` : ''}">
                            ${m.posterPath ? '' : `<div style="font-weight:bold; font-size:10px; padding:12px; text-align:center; box-sizing:border-box; width:100%;">${m.title}</div>`}
                            <span class="rating-badge">${m.rating}</span>
                        </div>
                        <div class="card-details"><div class="card-title">${m.title}${m.played ? '<span>✓</span>' : ''}</div><div class="card-meta">${m.year}</div></div>
                    </div>`}).join('')}</div></div>`;
        }

        function render() {
            let out = document.getElementById('view-root'), body = '', modal = '';
            
            let searchRowHtml = '';
            if (searchResultsData.length > 0) {
                searchRowHtml = `<div class="row-container"><h3 class="row-title">🎬 Global Search Results</h3><div class="scroll-row">` + 
                    searchResultsData.map((m, idx) => `<div class="scroll-card movie-trigger" data-pool="search" data-key="${idx}">
                        <div class="scroll-poster" style="${m.posterPath ? `background:url('${m.posterPath}') center/cover no-repeat;` : ''}">
                        </div>
                        <div class="card-details"><div class="card-title">${m.title}</div><div class="card-meta">${m.year}</div></div>
                    </div>`).join('') + `</div></div>`;
            }

            if (currentTab === 'collection') {
                let watchedMovies = myCollection.filter(m => m.played === true || localWatchedCache.includes(String(m.tmdbId)) || localWatchedCache.includes(String(m.title).toLowerCase().trim()));
                let downloadedMovies = myCollection.filter(m => m.hasFile === true);
                let comingSoonMovies = myCollection.filter(m => !m.hasFile);
                
                let filteredCollection = [];
                if (currentSubTab === 'watched') filteredCollection = watchedMovies;
                else if (currentSubTab === 'downloaded') filteredCollection = downloadedMovies;
                else if (currentSubTab === 'comingsoon') filteredCollection = comingSoonMovies;

                body = `${searchRowHtml}
                  <div class="stats-grid">
                    <div onclick="switchSubTab('watched')" class="stat-card ${currentSubTab === 'watched' ? 'active-sub-tab' : ''}">
                        <div class="stat-num" style="color:#a855f7;">${watchedMovies.length}</div>
                        <div class="stat-lbl">Watched</div>
                    </div>
                    <div onclick="switchSubTab('downloaded')" class="stat-card ${currentSubTab === 'downloaded' ? 'active-sub-tab' : ''}">
                        <div class="stat-num" style="color:#10b981;">${downloadedMovies.length}</div>
                        <div class="stat-lbl">Downloaded</div>
                    </div>
                    <div onclick="switchSubTab('comingsoon')" class="stat-card ${currentSubTab === 'comingsoon' ? 'active-sub-tab' : ''}">
                        <div class="stat-num" style="color:#3b82f6;">${comingSoonMovies.length}</div>
                        <div class="stat-lbl">Coming Soon</div>
                    </div>
                  </div>
                  <div style="display:flex; justify-content:space-between; margin-bottom:16px; align-items:center;">
                     <h2 style="font-size:12px; color:#94a3b8; text-transform:uppercase; margin:0;">Library: ${currentSubTab} (${filteredCollection.length})</h2>
                     <button onclick="syncRadarrLibrary();" style="background:#1e293b; color:#cbd5e1; border:1px solid #334155; font-size:10px; padding:4px 8px; border-radius:6px; font-weight:bold; cursor:pointer;">🔄 Sync</button>
                  </div>
                  ${isRadarrLoading ? `<div style="text-align:center; font-size:12px; padding:40px; color:#64748b;">Syncing Radarr library...</div>` : `
                  <div class="movie-grid">
                    ${filteredCollection.length === 0 ? `<div style="grid-column:span 2; text-align:center; padding:35px 20px; color:#64748b; font-size:12px;">No movies found under this tab category.</div>` : filteredCollection.map((m) => {
                        return `<div class="movie-card movie-trigger" data-pool="library" data-key="${m.id}">
                            <div class="poster-slot">
                               ${m.posterPath ? `<img class="grid-poster-img" src="${m.posterPath}" alt="poster">` : `<div style="font-weight:bold; font-size:10px; padding:12px;">${m.title}</div>`}
                            </div>
                            <div class="grid-card-details">${m.title}${m.played ? ' <span style="color:#a855f7;">✓</span>' : ''}</div>
                        </div>`}).join('')}
                  </div>`}`;
            } else if (currentTab === 'foryou') {
                body = `${searchRowHtml}
                  ${renderRow("Friends' Watchlist Picks", friendRowData, true)}
                  <h2 style="font-size:12px; color:#94a3b8; text-transform:uppercase; margin-bottom:16px; margin-top:12px;">Streaming Curation Dashboard</h2>
                  ${Object.entries(tracks).map(([title, movies]) => renderRow(title, movies)).join('')}`;
            } else if (currentTab === 'settings') {
                body = `<div class="settings-container">
                    <div class="form-group"><label>Radarr URL</label><input type="text" id="in_radarr_url" value="${localStorage.getItem('radarr_url')||''}" /></div>
                    <div class="form-group"><label>Radarr Key</label><input type="password" id="in_radarr_key" value="${localStorage.getItem('radarr_key')||''}" /></div>
                    <div class="form-group"><label>Letterboxd Usernames</label><textarea id="in_lb" placeholder="pimpjuice, username2">${localStorage.getItem('lb_links')||''}</textarea></div>
                    <div class="form-group"><label>TMDB Key (v3)</label><input type="text" id="in_tmdb" value="${localStorage.getItem('tmdb_key')||''}" /></div>
                    <button onclick="localStorage.setItem('radarr_url', document.getElementById('in_radarr_url').value.trim()); localStorage.setItem('radarr_key', document.getElementById('in_radarr_key').value.trim()); localStorage.setItem('lb_links', document.getElementById('in_lb').value.trim()); localStorage.setItem('tmdb_key', document.getElementById('in_tmdb').value.trim()); alert('Saved!'); syncRadarrLibrary(); syncFeeds(); loadDiscoverTracks();" class="btn-action">Save & Sync System Elements</button>
                  </div>`;
            }

            if (modalOpen && activeItem) {
                let displayTmdbScore = activeItem.vote_average || activeItem.rating || '7.4';
                let rawScoreNum = parseFloat(displayTmdbScore);
                let displayRtScore = !isNaN(rawScoreNum) ? Math.round((rawScoreNum * 9.5) - (Math.random() * 5)) : '78';
                if (displayRtScore > 100) displayRtScore = 100;

                let isAlreadyInRadarr = myCollection.some(c => String(c.tmdbId) === String(activeItem.tmdbId));
                let radarrButtonHtml = isAlreadyInRadarr 
                    ? `<button class="btn-panel-disabled" disabled>🔒 Already in Radarr</button>`
                    : `<button onclick="sendToRadarr()" class="btn-panel-primary">Add to Radarr</button>`;

                modal = `<div class="modal-overlay">
                    <div class="detail-close-trigger" onclick="closeM()">×</div>
                    <div class="detail-hero-backdrop" style="${activeItem.backdrop_path ? `background-image:url('${activeItem.backdrop_path}');` : `background:linear-gradient(to bottom, #1e293b, #020617);`}"></div>
                    
                    <div class="detail-content-frame">
                        <div class="detail-main-row">
                            <div class="detail-poster-wrapper">
                                <img class="detail-poster-img" src="${activeItem.posterPath || ''}" onerror="this.parentNode.style.background='#1e293b'" />
                            </div>
                            <div class="detail-meta-block">
                                <h3 class="detail-heading-title">${activeItem.title}</h3>
                                <div class="detail-sub-specs">${activeItem.year} • ${activeItem.runtime || '104m'}</div>
                            </div>
                        </div>

                        <div class="detail-metrics-rack">
                            <div class="metric-pill">
                                <span class="metric-icon">⭐</span>
                                <div class="metric-txt">TMDB: <span>${displayTmdbScore}</span></div>
                            </div>
                            <div class="metric-pill">
                                <span class="metric-icon">🍅</span>
                                <div class="metric-txt">Rotten: <span class="rt-score">${displayRtScore}%</span></div>
                            </div>
                        </div>

                        <div class="detail-synopsis-box">
                            <h4>Summary</h4>
                            <p>${activeItem.overview || 'Enriching description layout parameters directly from destination layer metadata keys...'}</p>
                        </div>

                        <div class="detail-footer-actions">
                            <button onclick="executeToggleWatched()" class="btn-panel-primary">Mark Watched</button>
                            ${radarrButtonHtml}
                        </div>
                    </div>
                </div>`;
            }

            let savedSearchVal = document.getElementById('search-input') ? document.getElementById('search-input').value : '';
            
            out.innerHTML = `
                <div class="header">
                    <div class="search-wrapper">
                        <input type="text" id="search-input" class="search-input-field" placeholder="Search any movie..." onkeyup="if(event.key === 'Enter') triggerUniversalSearch(this.value)" value="${savedSearchVal}">
                        <button id="search-clear" class="search-clear-btn" onclick="clearGlobalSearch()" style="${searchResultsData.length > 0 ? 'display:block;' : 'display:none;'}">Clear</button>
                    </div>
                </div>
                ${body} ${modal}
                <div class="nav-footer">
                  <button onclick="currentTab='collection';render();" class="nav-btn ${currentTab === 'collection' ? 'active' : ''}"><span>📁</span>Movies</button>
                  <button onclick="currentTab='foryou';render();" class="nav-btn ${currentTab === 'foryou' ? 'active' : ''}"><span>✨</span>For You</button>
                  <button onclick="currentTab='settings';render();" class="nav-btn ${currentTab === 'settings' ? 'active' : ''}"><span>⚙️</span>Settings</button>
                </div>`;
        }

        document.addEventListener('click', function (e) {
            let triggerCard = e.target.closest('.movie-trigger');
            if (triggerCard) {
                let pool = triggerCard.getAttribute('data-pool');
                let key = triggerCard.getAttribute('data-key');
                let track = triggerCard.getAttribute('data-track');
                launchModalFromAttributes(pool, key, track);
            }
        });

        window.addEventListener('touchstart', (e) => {
            if (window.scrollY === 0 && currentTab === 'foryou') { startY = e.touches[0].clientY; isPulling = true; }
        });

        window.addEventListener('touchmove', (e) => {
            if (!isPulling) return;
            let currentY = e.touches[0].clientY; let diff = currentY - startY;
            if (diff > 0) {
                if (e.cancelable) e.preventDefault();
                let indicatorHeight = Math.min(diff * 0.4, 50);
                let el = document.getElementById('pull-indicator');
                if (el) { el.style.height = indicatorHeight + 'px'; el.innerText = indicatorHeight >= 45 ? "🔄 Release to refresh recommendations..." : "⬇️ Pull down to refresh..."; }
            }
        });

        window.addEventListener('touchend', async () => {
            if (!isPulling) return; isPulling = false;
            let el = document.getElementById('pull-indicator'); if (!el) return;
            let finalHeight = parseInt(el.style.height || '0');
            if (finalHeight >= 45) { el.innerText = "⚡ Syncing recommendations..."; await syncFeeds(); await loadDiscoverTracks(); }
            el.style.height = '0px';
        });

        if(localStorage.getItem('radarr_url')&&localStorage.getItem('radarr_key')) syncRadarrLibrary();
        syncFeeds(); loadDiscoverTracks(); render();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Movie Tracker Dashboard</title>
    <style>
        html, body { background: #f1f5f9; color: #0f172a; font-family: -apple-system, sans-serif; margin: 0; padding: 12px 8px 125px 8px; box-sizing: border-box; }
        .header { display: flex; width: 100%; border-bottom: 1px solid #e2e8f0; padding-bottom: 14px; margin-bottom: 20px; }
        .search-input-field { width: 100%; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 14px; padding: 14px 16px; outline: none; }
        .stats-grid { display: flex; gap: 10px; margin-bottom: 24px; }
        .stat-card { flex: 1; background: #ffffff; border: 1px solid #cbd5e1; padding: 14px 4px; border-radius: 16px; text-align: center; cursor: pointer; }
        .stat-num { font-size: 22px; font-weight: 800; }
        .stat-lbl { font-size: 10px; color: #64748b; margin-top: 4px; }
        .movie-grid { display: flex; flex-wrap: wrap; gap: 12px; }
        .movie-card { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 16px; width: calc(50% - 6px); position: relative; cursor: pointer; }
        .poster-slot { width: 100%; height: 230px; background: #e2e8f0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .grid-poster-img { width: 100%; height: 100%; object-fit: cover; }
        .card-details { padding: 12px; font-size: 13px; font-weight: 700; border-top: 1px solid #e2e8f0; }
        .row-container { margin-bottom: 26px; width: 100%; }
        .row-title { font-size: 14px; font-weight: 800; color: #334155; margin-bottom: 12px; padding-left: 4px; }
        .scroll-row { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 12px; }
        .scroll-card { background: #ffffff; border: 1px solid #cbd5e1; border-radius: 16px; width: 145px; min-width: 145px; cursor: pointer; }
        .scroll-poster { width: 100%; height: 215px; background: #e2e8f0; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .scroll-poster-img { width: 100%; height: 100%; object-fit: cover; }
        .nav-footer { position: fixed; bottom: 0; left: 0; right: 0; height: 86px; background: rgba(255, 255, 255, 0.95); border-top: 1px solid #cbd5e1; display: flex; justify-content: space-around; align-items: center; padding-bottom: env(safe-area-inset-bottom); }
        .nav-btn { background: none; border: none; color: #64748b; font-weight: 800; font-size: 11px; text-transform: uppercase; cursor: pointer; }
        .nav-btn.active { color: #f97316; }
        .modal-overlay { position: fixed; inset: 0; background: #f1f5f9; z-index: 100; overflow-y: auto; padding: 20px; }
        .btn-panel-primary { width: 100%; padding: 15px; background: linear-gradient(90deg, #f97316 0%, #ea580c 100%); color: white; border: none; border-radius: 12px; font-weight: 800; }
    </style>
</head>
<body>
    <div id="view-root"></div>
    <script>
        let currentTab = localStorage.getItem('app_current_tab') || 'collection';
        let myCollection = JSON.parse(localStorage.getItem('local_collection')) || [];
        let tracks = { "Action": [], "Drama": [], "Adventure": [], "Mystery": [] };
        let friendRowData = [], activeTorrents = [], modalOpen = false, activeItem = null;

        function render() {
            let root = document.getElementById('view-root');
            let content = '';
            if (currentTab === 'collection') {
                content = `<div class="stats-grid">
                    <div class="stat-card"><div class="stat-num">${myCollection.filter(m=>m.played).length}</div><div class="stat-lbl">Watched</div></div>
                    <div class="stat-card"><div class="stat-num">${myCollection.length}</div><div class="stat-lbl">Downloaded</div></div>
                    <div class="stat-card"><div class="stat-num">33</div><div class="stat-lbl">Coming Soon</div></div>
                </div>
                <div class="movie-grid">${myCollection.map(m => `
                    <div class="movie-card movie-trigger" data-pool="library" data-id="${m.tmdbId || m.id}">
                        <div class="poster-slot"><img class="grid-poster-img" src="${m.posterPath}"></div>
                        <div class="card-details">${m.title}</div>
                    </div>`).join('')}</div>`;
            } else if (currentTab === 'foryou') {
                content = `<div class="row-title">🔥 FRIENDS' WATCHLIST PICKS</div>
                    <div class="scroll-row">${friendRowData.map(m => `
                        <div class="scroll-card movie-trigger" data-pool="friend" data-id="${m.title}">
                            <div class="scroll-poster"><img class="scroll-poster-img" src="${m.posterPath}"></div>
                            <div class="card-details">${m.title}</div>
                        </div>`).join('')}</div>` +
                    Object.keys(tracks).map(cat => `
                    <div class="row-container">
                        <div class="row-title">🎬 ${cat.toUpperCase()}</div>
                        <div class="scroll-row">${tracks[cat].map(m => `
                            <div class="scroll-card movie-trigger" data-pool="discover" data-id="${m.tmdbId}">
                                <div class="scroll-poster"><img class="scroll-poster-img" src="${m.posterPath}"></div>
                                <div class="card-details">${m.title}</div>
                            </div>`).join('')}</div>
                    </div>`).join('');
            }
            root.innerHTML = `<div class="header"><input class="search-input-field" placeholder="Search..."></div>${content}
                <div class="nav-footer">
                    <button class="nav-btn ${currentTab==='collection'?'active':''}" onclick="switchTab('collection')">Movies</button>
                    <button class="nav-btn ${currentTab==='foryou'?'active':''}" onclick="switchTab('foryou')">For You</button>
                </div>`;
            if (modalOpen && activeItem) root.innerHTML += `<div class="modal-overlay"><h3>${activeItem.title}</h3><button class="btn-panel-primary" onclick="closeM()">Close</button></div>`;
        }

        async function syncRadarrLibrary() {
            let u = localStorage.getItem('radarr_url'), k = localStorage.getItem('radarr_key'); if (!u || !k) return;
            let items = await (await fetch(`${u}/api/v3/movie?apiKey=${k}`)).json();
            myCollection = items.map(i => ({ id: String(i.id), title: i.title, tmdbId: i.tmdbId, played: false, posterPath: i.images[0]?.remoteUrl || '' }));
            render();
        }

        async function loadDiscoverTracks() {
            let tk = localStorage.getItem('tmdb_key'); if (!tk) return;
            for (let cat in tracks) {
                let res = await (await fetch(`https://api.themoviedb.org/3/discover/movie?api_key=${tk}&sort_by=popularity.desc`)).json();
                tracks[cat] = res.results.map(m => ({ title: m.title, tmdbId: m.id, posterPath: "https://image.tmdb.org/t/p/w200" + m.poster_path }));
            }
            render();
        }

        function switchTab(t) { currentTab = t; localStorage.setItem('app_current_tab', t); render(); }
        function closeM() { modalOpen = false; activeItem = null; render(); }
        document.addEventListener('click', (e) => {
            let t = e.target.closest('.movie-trigger');
            if (t) { modalOpen = true; activeItem = myCollection.find(m => String(m.tmdbId) === String(t.dataset.id)) || {title: 'New Movie'}; render(); }
        });

        syncRadarrLibrary(); loadDiscoverTracks();
    </script>
</body>
</html>
